<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Цифрлық детектив — ЖИ зертханасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Rubik',system-ui,'Segoe UI',Roboto,sans-serif;color:#e7ecff;background:#060914}
body{min-height:100vh}body{background:radial-gradient(ellipse 110% 55% at 50% -5%,rgba(40,30,150,.4),transparent 60%),radial-gradient(ellipse 90% 60% at 50% 110%,rgba(0,90,180,.22),transparent 60%),#060914;
  padding:60px 14px 20px;display:flex;justify-content:center}
.wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:21px;font-weight:900}
.stats{display:flex;gap:8px}
.stat{padding:8px 13px;border-radius:12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:#8ee6ff;
  background:rgba(14,26,62,.92);border:1.5px solid rgba(80,200,255,.4)}
.stat.low{color:#ff9a9a;border-color:#ef4444}
.prog{display:flex;gap:8px}
.prog i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.1);transition:.3s}
.prog i.active{background:linear-gradient(90deg,#6d5dfc,#37e1ff)}
.prog i.done{background:linear-gradient(90deg,#1e9e4a,#46e06a)}
.card{background:linear-gradient(180deg,rgba(16,24,60,.92),rgba(10,15,42,.96));border:1.5px solid rgba(90,120,210,.32);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.5px;padding:5px 13px;border-radius:20px;background:#27308a;color:#dfe6ff}
.bloom{font-size:12px;font-weight:700;color:#9fb0e8;margin:7px 0 10px}
.q{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
.item{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:112px;padding:14px 6px;border-radius:14px;cursor:pointer;font:inherit;color:#e7ecff;
  background:rgba(22,30,70,.9);border:2px solid rgba(90,120,210,.32);transition:transform .15s,border-color .2s}
.item:hover:not(:disabled){transform:translateY(-3px);border-color:rgba(120,150,255,.8)}
.item svg{width:46px;height:46px}
.item span{font-size:14px;font-weight:700;text-align:center;line-height:1.2}
.item.ok{border-color:#46e06a;background:rgba(20,70,40,.55)}
.item.bad{border-color:#ef4444;background:rgba(70,20,24,.55)}
.item:disabled{cursor:default}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:block;width:100%;min-height:50px;padding:13px 15px;border-radius:13px;cursor:pointer;text-align:left;font:inherit;font-size:15px;font-weight:700;color:#e7ecff;
  background:rgba(22,30,70,.9);border:2px solid rgba(90,120,210,.32);transition:transform .15s,border-color .2s}
.opt:hover:not(:disabled){transform:translateX(3px);border-color:rgba(120,150,255,.8)}
.opt.sel{border-color:#37e1ff;background:rgba(20,50,90,.8)}
.opt.ok{border-color:#46e06a;background:rgba(20,70,40,.55)}
.opt.bad{border-color:#ef4444;background:rgba(70,20,24,.55)}
.opt:disabled{cursor:default}
.note{margin-top:13px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;background:rgba(20,40,80,.7);border:1.5px solid rgba(80,160,255,.35);color:#cfe2ff}
.sub{font-size:14px;font-weight:700;color:#aebbe8;margin:14px 0 9px}
.btn{display:block;width:100%;min-height:50px;margin-top:13px;padding:13px;border:none;border-radius:13px;cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(180deg,#6d5dfc,#4a37d6)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.start{text-align:center;padding:30px 22px}
.start img{width:130px;margin-bottom:8px}
.start p{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Цифрлық детектив</h1>
    <div class="stats">
      <div class="stat" id="timer">05:00</div>
      <div class="stat">Балл: <span id="pts">0</span> / 10</div>
    </div>
  </div>
  <div class="prog" id="prog"><i></i><i></i><i></i></div>
  <div class="card" id="scene"></div>
</div>

<script src="{{ url_for('static', filename='js/kronos.js') }}?v=3"></script>
<script>
/* ════════════════════════════════════════════════════════════
   Цифрлық детектив — 01 Ақпарат тасымалдаушылары.
   Блум: білу 2, қолдану 2, бағалау 6. Уақыт: 5 минут.
════════════════════════════════════════════════════════════ */
const IC={
  flash:'<svg viewBox="0 0 48 48" fill="none"><rect x="15" y="14" width="18" height="29" rx="4" fill="#3f7bff"/><rect x="19" y="4" width="10" height="11" fill="#c8d4e8"/><path d="M22 8v3M26 8v3" stroke="#5a6b86" stroke-width="2"/><circle cx="24" cy="30" r="4" fill="#bcd4ff"/></svg>',
  cd:'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#c9d8f0"/><path d="M24 4a20 20 0 0117 10L24 24z" fill="#8fe3ff"/><path d="M24 44a20 20 0 01-17-10l17-10z" fill="#d7b6ff"/><circle cx="24" cy="24" r="6" fill="#0d1636"/></svg>',
  sd:'<svg viewBox="0 0 48 48"><path d="M12 5h17l8 8v30H12z" fill="#2f4f9e"/><path d="M16 5v9M21 5v9M26 5v9" stroke="#ffd24a" stroke-width="2.6"/><rect x="17" y="24" width="15" height="11" rx="2" fill="#bcd4ff"/></svg>',
  hdd:'<svg viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="30" rx="5" fill="#46536e"/><circle cx="24" cy="23" r="10" fill="#aebdd6"/><circle cx="24" cy="23" r="3" fill="#46536e"/><circle cx="35" cy="34" r="2" fill="#46e06a"/></svg>',
  cable:'<svg viewBox="0 0 48 48" fill="none"><path d="M10 12c0 22 28 2 28 24" stroke="#8fa3c6" stroke-width="4" stroke-linecap="round"/><rect x="4" y="4" width="12" height="9" rx="2" fill="#c8d4e8"/><rect x="32" y="35" width="12" height="9" rx="2" fill="#c8d4e8"/></svg>',
  mouse:'<svg viewBox="0 0 48 48" fill="none"><rect x="12" y="6" width="24" height="36" rx="12" fill="#c9d8f0"/><path d="M24 6v13M12 19h24" stroke="#5a6b86" stroke-width="2"/><rect x="22" y="11" width="4" height="6" rx="2" fill="#3f7bff"/></svg>',
  keyb:'<svg viewBox="0 0 48 48"><rect x="3" y="13" width="42" height="23" rx="4" fill="#46536e"/><g fill="#c9d8f0"><rect x="8" y="18" width="5" height="4" rx="1"/><rect x="15" y="18" width="5" height="4" rx="1"/><rect x="22" y="18" width="5" height="4" rx="1"/><rect x="29" y="18" width="5" height="4" rx="1"/><rect x="36" y="18" width="4" height="4" rx="1"/><rect x="13" y="26" width="22" height="5" rx="1"/></g></svg>',
  mon:'<svg viewBox="0 0 48 48"><rect x="4" y="7" width="40" height="27" rx="3" fill="#46536e"/><rect x="8" y="11" width="32" height="19" fill="#3f7bff"/><path d="M19 34h10v6H19zM13 41h22" stroke="#46536e" stroke-width="3"/></svg>',
};
const ITEMS=[
  {k:'flash',n:'Флешка',c:true},{k:'cable',n:'Кабель'},{k:'cd',n:'CD-диск',c:true},{k:'mouse',n:'Тінтуір'},
  {k:'keyb',n:'Пернетақта'},{k:'sd',n:'SD-карта',c:true},{k:'mon',n:'Монитор'},{k:'hdd',n:'Сыртқы қатты диск',c:true},
];
const STRATS=[
  {t:'Бұлтты қойма + сыртқы дискідегі көшірме',ok:true},
  {t:'Тек флешка'},{t:'Тек компьютердің жұмыс үстелі'},{t:'Тек электрондық пошта'},
];
const REASONS=[
  {t:'Бір құрылғы бұзылса, көшірме сақталады',ok:true},
  {t:'Бұлт тегін'},
  {t:'Бұлтқа кез келген жерден қол жеткізуге болады',ok:true},
  {t:'Флешка әдемі'},
  {t:'Пошта ең жылдам'},
];
const bloom={bilu:0,koldanu:0,bagalau:0};
const BLOOM_MAX={bilu:2,koldanu:2,bagalau:6};
let left=300, tick=null, finished=false;

const el=document.getElementById('scene');
const total=()=>bloom.bilu+bloom.koldanu+bloom.bagalau;
function pts(){ document.getElementById('pts').textContent=String(total()).replace('.',','); }
function prog(i){ [...document.getElementById('prog').children].forEach((b,k)=>b.className=k<i?'done':k===i?'active':''); }
function clock(){
  const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0'), t=document.getElementById('timer');
  t.textContent=m+':'+s; t.classList.toggle('low',left<=30);
}

function start(){
  el.innerHTML=`<div class="start"><img src="/static/img/toqsan4/lab/robot.webp" alt="Кронос">
    <p>Кронос: «Сәлем, детектив! Мектептің маңызды деректері жоғалып кетпеуі керек. Бірге тергейік. Бірақ есіңде болсын: мен де қателесемін!»</p>
    <button class="btn" id="go">Бастау</button></div>`;
  document.getElementById('go').onclick=()=>{
    tick=setInterval(()=>{ left--; clock(); if(left<=0) finish(true); },1000);
    scene1();
  };
}

/* 1-сахна: тасымалдаушыларды анықтау (білу, 2 балл) */
function scene1(){
  prog(0);
  let found=0, sc=0;
  el.innerHTML=`<span class="badge">1-САХНА: Тасымалдаушыларды анықтау</span><div class="bloom">Блум: Білу · 2 балл</div>
    <div class="q">Ақпаратты сақтайтын барлық құрылғыны тап.</div><div class="grid" id="g"></div><div id="n"></div>`;
  const g=document.getElementById('g');
  ITEMS.forEach(it=>{
    const b=document.createElement('button'); b.type='button'; b.className='item'; b.innerHTML=IC[it.k]+`<span>${it.n}</span>`;
    b.onclick=()=>{
      b.disabled=true;
      if(it.c){ b.classList.add('ok'); found++; sc+=.5; }
      else { b.classList.add('bad'); sc=Math.max(0,sc-.5); }
      bloom.bilu=sc; pts();
      if(found===4){
        g.querySelectorAll('button').forEach(x=>x.disabled=true);
        document.getElementById('n').innerHTML=`<div class="note">Төрт тасымалдаушы табылды. Бұл сахнадағы балл: ${sc} / 2.</div><button class="btn" id="nx">Келесі сахна</button>`;
        document.getElementById('nx').onclick=scene2;
      }
    };
    g.appendChild(b);
  });
}

/* 2-сахна: жағдайға қолайлы тасымалдаушы (қолдану, 2 балл) */
function scene2(){
  prog(1);
  const OPTS=[{t:'Флешка',ok:true},{t:'CD-диск (сыйымдылығы 700 МБ, жеткіліксіз)'},{t:'Бұлтты қойма (интернет жоқ)'},{t:'Дискета'}];
  el.innerHTML=`<span class="badge">2-САХНА: Қолайлы тасымалдаушы</span><div class="bloom">Блум: Қолдану · 2 балл</div>
    <div class="q">Мұғалімге 2 ГБ бейнефильмді сабаққа алып бару керек. Мектепте интернет жоқ.</div><div id="b"></div>`;
  const b=document.getElementById('b');
  const explain='CD-дискінің сыйымдылығы шамамен 700 МБ, ал бейнефильм 2 ГБ. Сондықтан флешка қолайлы.';
  const next=extra=>{
    b.insertAdjacentHTML('beforeend',`<div class="note">${extra?extra+' ':''}${explain}</div><button class="btn" id="nx">Келесі сахна</button>`);
    document.getElementById('nx').onclick=scene3;
  };
  Kronos.ask({text:'Менің ойымша, CD-диск жарайды.',wrong:true,
    onAgree(){ next(Kronos.wrongAgreed()?Kronos.PHRASE.wrong:''); },
    onCheck(){
      Kronos.caughtOne(); bloom.koldanu+=1; pts();
      b.innerHTML='<div class="opts" id="o"></div>';
      const o=document.getElementById('o');
      OPTS.forEach(x=>{
        const e=document.createElement('button'); e.type='button'; e.className='opt'; e.textContent=x.t;
        e.onclick=()=>{
          o.querySelectorAll('button').forEach(q=>q.disabled=true);
          e.classList.add(x.ok?'ok':'bad');
          if(x.ok){ bloom.koldanu+=1; pts(); }
          next(Kronos.PHRASE.found);
        };
        o.appendChild(e);
      });
    }
  });
}

/* 3-сахна: ең сенімді сақтау тәсілі (бағалау, 6 балл) */
function scene3(){
  prog(2);
  el.innerHTML=`<span class="badge">3-САХНА: Ең сенімді тәсіл</span><div class="bloom">Блум: Бағалау · 6 балл</div>
    <div class="q">Сыныптың бір жылдық жобасы ешқашан жоғалмауы керек. Қалай сақтаған дұрыс?</div><div id="b"></div>`;
  let lead='';
  Kronos.ask({text:'Бір флешкаға сақтау жеткілікті. Флешка ешқашан бұзылмайды.',wrong:true,
    onAgree(){ lead=Kronos.wrongAgreed()?Kronos.PHRASE.wrong:''; strategies(lead); },
    onCheck(){ Kronos.caughtOne(); bloom.bagalau+=2; pts(); strategies(Kronos.PHRASE.found); }
  });
}
function strategies(lead){
  const b=document.getElementById('b');
  b.innerHTML=`<div class="sub">Ең сенімді стратегияны таңда:</div><div class="opts" id="o"></div>`;
  const o=document.getElementById('o');
  STRATS.forEach(x=>{
    const e=document.createElement('button'); e.type='button'; e.className='opt'; e.textContent=x.t;
    e.onclick=()=>{
      o.querySelectorAll('button').forEach(q=>q.disabled=true);
      e.classList.add(x.ok?'ok':'bad');
      if(x.ok){ bloom.bagalau+=2; pts(); }
      reasons(lead);
    };
    o.appendChild(e);
  });
}
function reasons(lead){
  const b=document.getElementById('b');
  b.insertAdjacentHTML('beforeend',`<div class="sub">Таңдауыңды негізде: дұрыс екі себепті белгіле.</div><div class="opts" id="r"></div><button class="btn" id="done" disabled>Қорытындылау</button>`);
  const r=document.getElementById('r'), done=document.getElementById('done'), picked=new Set();
  REASONS.forEach(x=>{
    const e=document.createElement('button'); e.type='button'; e.className='opt'; e.textContent=x.t; e.setAttribute('aria-pressed','false');
    e.onclick=()=>{
      if(picked.has(x)) picked.delete(x); else if(picked.size<2) picked.add(x);
      [...r.children].forEach((q,i)=>{ const on=picked.has(REASONS[i]); q.classList.toggle('sel',on); q.setAttribute('aria-pressed',on); });
      done.disabled=picked.size!==2;
    };
    r.appendChild(e);
  });
  done.onclick=()=>{
    done.disabled=true;
    r.querySelectorAll('button').forEach((q,i)=>{ q.disabled=true; if(picked.has(REASONS[i])) q.classList.add(REASONS[i].ok?'ok':'bad'); });
    picked.forEach(x=>{ if(x.ok) bloom.bagalau+=1; }); pts();
    const n=document.createElement('button'); n.className='btn'; n.textContent='Нәтижені көру'; n.onclick=()=>finish(false);
    if(lead) b.insertAdjacentHTML('beforeend',`<div class="note">${lead}</div>`);
    b.appendChild(n); done.remove();
  };
}

function finish(timeUp){
  if(finished) return; finished=true; clearInterval(tick); prog(3);
  bqFinish({game_name:'Цифрлық детектив', score:total(), bloom, bloom_max:BLOOM_MAX,
    kronos:Kronos.summary(), title:timeUp?'Уақыт аяқталды':'Тергеу аяқталды!', backUrl:'/toqsan_4'});
}
clock(); pts(); prog(-1); start();
</script>
{% include '_win_modal.html' %}
</body>
</html>
