<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Файл әлемі — ЖИ зертханасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Rubik',system-ui,'Segoe UI',Roboto,sans-serif;color:#e7ecff;background:#06121f}
body{min-height:100vh}body{background:radial-gradient(ellipse 110% 55% at 50% -5%,rgba(30,120,190,.34),transparent 60%),radial-gradient(ellipse 90% 60% at 50% 110%,rgba(0,110,150,.2),transparent 60%),#06121f;
  padding:60px 14px 20px;display:flex;justify-content:center}
.wrap{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:21px;font-weight:900}
.stat{padding:8px 13px;border-radius:12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:#8ee6ff;background:rgba(12,30,62,.92);border:1.5px solid rgba(55,225,255,.42)}
.prog{display:flex;gap:8px}
.prog i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.1);transition:.3s}
.prog i.active{background:linear-gradient(90deg,#2f8cff,#37e1ff)}
.prog i.done{background:linear-gradient(90deg,#1e9e4a,#46e06a)}
.card{background:linear-gradient(180deg,rgba(14,28,58,.93),rgba(8,16,38,.97));border:1.5px solid rgba(70,150,230,.34);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.5px;padding:5px 13px;border-radius:20px;background:#1a4d99;color:#e0efff}
.bloom{font-size:12px;font-weight:700;color:#9fc4e8;margin:7px 0 10px}
.q{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:14px}
.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
@media(max-width:640px){.folders{grid-template-columns:1fr}}
.folder{display:flex;flex-direction:column;gap:7px;min-height:220px;padding:11px;border-radius:14px;background:rgba(20,40,80,.6);border:2px solid rgba(90,150,230,.3);transition:border-color .2s,background .2s}
.folder.target{border-color:#37e1ff;background:rgba(30,70,120,.7);cursor:pointer}
.folder h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.folder h3 svg{width:22px;height:22px}
.file{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:7px 9px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;text-align:left;word-break:break-word;color:#14203c;background:#f1f6ff;border:2.5px solid transparent;cursor:default}
.file.can{cursor:pointer}
.file.can:hover{border-color:#37a6ff}
.file.sel{border-color:#ff9a2a;box-shadow:0 0 0 2px rgba(255,154,42,.35)}
.file i{flex-shrink:0;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;font-style:normal;font-size:10px;font-weight:900;color:#fff}
.file i.doc{background:#2f79ff}.file i.ppt{background:#ee6a2c}.file i.img{background:#2ca66a}
.note{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;background:rgba(20,44,84,.7);border:1.5px solid rgba(80,160,255,.35);color:#cfe2ff}
.btn{display:block;width:100%;min-height:50px;margin-top:13px;padding:13px;border:none;border-radius:13px;cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(180deg,#2f8cff,#1f5fd6)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.slide{padding:26px 20px;border-radius:14px;text-align:center;color:#14203c;background:#fff}
.slide small{display:block;margin-bottom:10px;font-size:12px;font-weight:800;color:#6a7797}
.word{margin:3px 2px;padding:3px 6px;border:none;border-radius:6px;cursor:pointer;font:inherit;font-size:22px;font-weight:800;color:#14203c;background:transparent}
.word:hover:not(:disabled){background:#dbe8ff}
.word.ok{background:#b9f2cc}.word.bad{background:#ffc9c9}
.word:disabled{cursor:default}
.opt{display:block;width:100%;min-height:50px;margin-bottom:9px;padding:12px 15px;border-radius:13px;cursor:pointer;text-align:left;font:inherit;font-size:15px;font-weight:700;color:#e7ecff;background:rgba(22,40,80,.9);border:2px solid rgba(90,150,230,.32)}
.opt:hover:not(:disabled){border-color:rgba(120,190,255,.85)}
.opt.ok{border-color:#46e06a;background:rgba(20,70,40,.55)}
.opt.bad{border-color:#ef4444;background:rgba(70,20,24,.55)}
.opt:disabled{cursor:default}
.start{text-align:center;padding:26px 20px}
.start img{width:130px;margin-bottom:8px}
.start p{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Файл әлемі</h1>
    <div class="stat">Балл: <span id="pts">0</span> / 10</div>
  </div>
  <div class="prog" id="prog"><i></i><i></i></div>
  <div class="card" id="scene"></div>
</div>

<script src="{{ url_for('static', filename='js/kronos.js') }}?v=3"></script>
<script>
/* ════════════════════════════════════════════════════════════
   Файл әлемі — 05 Бұлттық сақтау және ынтымақтастық.
   1-кезең: Кронос сұрыптаған файлдарды тексеру (талдау, 6 балл).
   2-кезең: бұлттағы файлды бірлесе өңдеу және бөлісу (қолдану, 4 балл).
════════════════════════════════════════════════════════════ */
const FOLDERS=[{k:'edu',n:'Сабақтар'},{k:'proj',n:'Жобалар'},{k:'media',n:'Суреттер'}];
const FILES=[
  {id:'doc1',name:'Informatika_sabagy.docx',t:'doc',lab:'DOC',folder:'edu'},
  {id:'doc2',name:'Matematika_testi.docx',t:'doc',lab:'DOC',folder:'edu'},
  {id:'ppt1',name:'Synyp_jobasy.pptx',t:'ppt',lab:'PPT',folder:'proj'},
  {id:'ppt2',name:'Oiyn_jobasy.pptx',t:'ppt',lab:'PPT',folder:'proj'},
  {id:'img1',name:'Kiber_poster.png',t:'img',lab:'PNG',folder:'media'},
  {id:'img2',name:'Avatar.jpg',t:'img',lab:'JPG',folder:'media'},
];
/* Кронос 2 файлды әдейі қате қояды */
const KRONOS_SORT={doc1:'edu',doc2:'proj',ppt1:'proj',ppt2:'proj',img1:'edu',img2:'media'};
const FOLDER_IC='<svg viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v10a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="#ffc24a"/></svg>';
const WORDS=['Компютер','—','болашақтың','құралы'];
const PERMS=[
  {t:'Тек оқу',fb:'Бұл құқықпен досың тек қарай алады, бірақ көмектесе алмайды.'},
  {t:'Пікір жазу',fb:'Пікір жаза алады, бірақ слайдты өзгерте алмайды.'},
  {t:'Редакциялау',ok:true,fb:'Дұрыс! Енді досың файлды сенімен бір уақытта өңдей алады.'},
];
const bloom={koldanu:0,taldau:0};
let place={...KRONOS_SORT}, sel=null, checking=false, lead='';
const el=document.getElementById('scene');
const pts=()=>{ document.getElementById('pts').textContent=String(bloom.koldanu+bloom.taldau).replace('.',','); };
const prog=i=>[...document.getElementById('prog').children].forEach((b,k)=>b.className=k<i?'done':k===i?'active':'');

function start(){
  el.innerHTML=`<div class="start"><img src="/static/img/toqsan4/lab/robot.webp" alt="Кронос">
    <p>Кронос: «Бұлттағы файлдарды мен сұрыптап қойдым. Енді бірге жұмысты аяқтайық!»</p>
    <button class="btn" id="go">Бастау</button></div>`;
  document.getElementById('go').onclick=stage1;
}

/* 1-кезең: талдау */
function stage1(){
  prog(0);
  el.innerHTML=`<span class="badge">1-КЕЗЕҢ: Сұрыптауды тексеру</span><div class="bloom">Блум: Талдау · 6 балл</div>
    <div class="q" id="tq">Кронос файлдарды папкаларға сұрыптады.</div><div class="folders" id="fs"></div><div id="act"></div>`;
  drawFolders();
  Kronos.ask({text:'Мен 6 файлды папкаларға сұрыптап қойдым. Бәрі дұрыс, тексерудің қажеті жоқ.',wrong:true,
    onAgree(){ lead=Kronos.wrongAgreed()?Kronos.PHRASE.wrong:''; endStage1(); },
    onCheck(){
      Kronos.caughtOne(); bloom.taldau=2; pts(); checking=true; drawFolders();
      document.getElementById('tq').textContent='Қате тұрған файлды бас, содан кейін дұрыс папканы бас.';
      document.getElementById('act').innerHTML='<button class="btn" id="dn">Тексеруді аяқтау</button>';
      document.getElementById('dn').onclick=checkDone;
    }
  });
}
function drawFolders(){
  const box=document.getElementById('fs'); box.innerHTML='';
  FOLDERS.forEach(f=>{
    const d=document.createElement('div'); d.className='folder'+(sel?' target':'');
    d.innerHTML=`<h3>${FOLDER_IC}${f.n}</h3>`;
    d.onclick=()=>{ if(sel){ place[sel]=f.k; sel=null; drawFolders(); } };
    FILES.filter(x=>place[x.id]===f.k).forEach(x=>{
      const b=document.createElement('button'); b.type='button'; b.className='file'+(checking?' can':'')+(sel===x.id?' sel':'');
      b.innerHTML=`<i class="${x.t}">${x.lab}</i><span>${x.name}</span>`;
      b.disabled=!checking;
      b.onclick=e=>{ e.stopPropagation(); sel=sel===x.id?null:x.id; drawFolders(); };
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}
function checkDone(){
  checking=false; sel=null;
  let fixed=0, broke=0;
  FILES.forEach(f=>{ const was=KRONOS_SORT[f.id]===f.folder, now=place[f.id]===f.folder; if(!was&&now) fixed++; if(was&&!now) broke++; });
  bloom.taldau=Math.max(0,2+fixed*2-broke); pts();
  lead=fixed===2&&!broke?Kronos.PHRASE.found:`Сен ${fixed} қатені түзеттің. Файлдың түріне қарап тексер: құжат — Сабақтар, сурет — Суреттер.`;
  drawFolders(); endStage1();
}
function endStage1(){
  document.getElementById('act').innerHTML=`${lead?`<div class="note">${lead}</div>`:''}<button class="btn" id="nx">Келесі кезең</button>`;
  document.getElementById('nx').onclick=stage2;
}

/* 2-кезең: қолдану */
function stage2(){
  prog(1);
  let miss=0;
  el.innerHTML=`<span class="badge">2-КЕЗЕҢ: Бұлтта бірлесе жұмыс</span><div class="bloom">Блум: Қолдану · 4 балл</div>
    <div class="q">Synyp_jobasy.pptx бұлтта ашылды. Слайдтағы қате жазылған сөзді бас.</div>
    <div class="slide"><small>1-слайд</small><div id="sl"></div></div><div id="act"></div>`;
  const sl=document.getElementById('sl');
  WORDS.forEach(w=>{
    const b=document.createElement('button'); b.type='button'; b.className='word'; b.textContent=w;
    b.onclick=()=>{
      if(w!=='Компютер'){ miss++; b.classList.add('bad'); b.disabled=true; return; }
      b.textContent='Компьютер'; b.classList.add('ok');
      sl.querySelectorAll('button').forEach(q=>q.disabled=true);
      bloom.koldanu+=Math.max(0,2-miss); pts();
      share();
    };
    sl.appendChild(b);
  });
}
function share(){
  let miss=0;
  const a=document.getElementById('act');
  a.innerHTML=`<div class="note">Түзетілді: файлды компьютерге жүктемей-ақ, бұлтта өңдедің.</div>
    <div class="q" style="margin-top:14px">Досың слайдты безендіруге көмектесуі керек. Оған қандай құқық бересің?</div><div id="o"></div><div id="n"></div>`;
  const o=document.getElementById('o');
  PERMS.forEach(p=>{
    const b=document.createElement('button'); b.type='button'; b.className='opt'; b.textContent=p.t;
    b.onclick=()=>{
      b.disabled=true; b.classList.add(p.ok?'ok':'bad');
      document.getElementById('n').innerHTML=`<div class="note">${p.fb}</div>`;
      if(!p.ok){ miss++; return; }
      [...o.children].forEach(q=>q.disabled=true);
      bloom.koldanu+=Math.max(0,2-miss); pts();
      document.getElementById('n').insertAdjacentHTML('beforeend','<button class="btn" id="fin">Нәтижені көру</button>');
      document.getElementById('fin').onclick=finish;
    };
    o.appendChild(b);
  });
}
function finish(){
  prog(2);
  bqFinish({game_name:'Файл әлемі', score:bloom.koldanu+bloom.taldau, bloom, bloom_max:{koldanu:4,taldau:6},
    kronos:Kronos.summary(), title:'Файл әлемі реттелді!', backUrl:'/toqsan_4'});
}
pts(); prog(-1); start();
</script>
{% include '_win_modal.html' %}
</body>
</html>
