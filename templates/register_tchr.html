<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мұғалім тіркелуі</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/normalize.css') }}">
</head>
<body>
    <div class="container">
        <form action="/register_teacher" method="post" class="auth-card">
            <div class="auth-head">
                <div class="auth-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3L2 8l10 5 8-4v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 11v4c0 1.1 2.7 2.5 6 2.5s6-1.4 6-2.5v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>Мұғалім тіркеу</h1>
                <p class="auth-sub">BilimQuest порталында мұғалім аккаунтын құрыңыз</p>
                {% if error %}
                    <p class="auth-error">{{ error }}</p>
                {% endif %}
            </div>

            <label for="name">Аты жөніңізді жаз</label>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" id="name" name="name" placeholder="Мысалы: Мақсатқызы Айжан" value="{{ form_name or '' }}" required>
            </div>

            <label for="email">Почтаңызды жазыңыз</label>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="text" id="email" name="email" placeholder="Мысалы: aizhan00@mail.ru" value="{{ form_email or '' }}" required>
            </div>

            <label for="password">Құпиясөз ойлап тап</label>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="password" id="password" name="password" placeholder="Құпиясөз" required>
            </div>

            <label for="invite_code">Мұғалімдер үшін код</label>
            <div class="field">
                <svg class="field-icon" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/></svg>
                <input type="text" id="invite_code" name="invite_code" placeholder="Мектептен алған кодты жазыңыз" required>
            </div>
            <p class="field-hint">Бұл кодты мектеп әкімшісі немесе басқа мұғалім береді.</p>

            <button type="submit" class="auth-btn">Тіркелу</button>

            <div class="login-link">
                <p>Тіркелгенсіз бе?</p>
                <a href="/login_teacher" class="login-btn">Кіру</a>
            </div>
        </form>
    </div>
</body>
</html>
