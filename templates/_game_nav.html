<!-- ============================================================
     BilimQuest — ойын ішіндегі навигация (main.py → inject_game_nav)
     • «Артқа» — модуль бетіне (ойында өз батырмасы болмаса ғана)
     • «Келесі ойын» — тоқсан ішіндегі келесі ойынға, модульге оралмай
       Ойында өз «Артқа» батырмасы болса — «Келесі» соның жанына, сол стильде қойылады.
     • Нәтиже терезесінде де (_win_modal) «Келесі ойын» батырмасы шығады.
============================================================ -->
<style>
#bqGameNav{position:fixed;left:12px;top:12px;z-index:9990;display:flex;gap:8px;
  font-family:'Nunito','Open Sans',system-ui,Arial,sans-serif}
#bqGameNav a,.bqn-next-own{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
#bqGameNav a{height:38px;padding:0 14px 0 10px;border-radius:999px;font-size:14px;font-weight:800;color:#1e4fa8;
  background:rgba(255,255,255,.94);border:1px solid rgba(30,79,168,.18);box-shadow:0 6px 18px rgba(10,20,60,.25);
  transition:transform .15s ease,background .15s ease}
#bqGameNav a:hover{background:#fff}
#bqGameNav .bqn-back:hover{transform:translateX(-2px)}
#bqGameNav .bqn-next{padding:0 10px 0 14px;color:#fff;background:linear-gradient(135deg,#2f79ff,#5b4cf0);border-color:transparent}
#bqGameNav .bqn-next:hover{transform:translateX(2px);background:linear-gradient(135deg,#3b85ff,#6a5cff)}
#bqGameNav svg,.bqn-next-own svg{width:18px;height:18px;flex-shrink:0}
.bqn-next-own{margin-left:8px;white-space:nowrap}
@media (max-width:600px){ #bqGameNav{left:8px;top:8px;gap:6px} #bqGameNav a{height:34px;font-size:13px} }
</style>

{% if not has_back or nxt %}
<nav id="bqGameNav" aria-label="Ойын навигациясы">
  {% if not has_back %}
  <a class="bqn-back" href="{{ back }}" title="Модульге оралу">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Артқа
  </a>
  {% endif %}
  {% if nxt %}
  <a class="bqn-next" href="{{ nxt.url }}" title="Келесі ойын: {{ nxt.title }}">
    Келесі ойын
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  {% endif %}
</nav>
{% endif %}

<script>
(function(){
  var NEXT = {{ nxt|tojson }};
  window.__bqNext = NEXT;   // _win_modal нәтиже терезесі үшін
  {% if has_back and nxt %}
  /* Ойынның өз «Артқа» сілтемесі бар — «Келесі ойынды» соның жанына, сол стильмен қоямыз */
  var own = document.querySelector('a[href="{{ back }}"]:not(.bqn-back)');
  var nav = document.getElementById('bqGameNav');
  if (own && nav) {
    var a = own.cloneNode(false);
    a.href = NEXT.url; a.title = 'Келесі ойын: ' + NEXT.title;
    a.classList.add("bqn-next-own"); a.removeAttribute('id');
    a.innerHTML = 'Келесі ойын <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    own.parentNode.insertBefore(a, own.nextSibling);
    nav.remove();
  }
  {% endif %}
})();
</script>
