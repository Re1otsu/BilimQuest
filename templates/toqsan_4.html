<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilimQuest — Жасанды интеллект зертханасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="{{ url_for('static', filename='img/toqsan4/lab/bg.webp') }}">
<style>
/* ══════════════════════════════════════════════════════════════
   4-тоқсан — «Жасанды интеллект зертханасы» (макет бойынша)
   • Фон: тас зертхана (bg.webp) — бүкіл экранды толтырады
   • Сахна 1920×1080, экранға пропорционалды масштабталады (бұрмаланбайды)
   • Платформалар — суреттер; нөмір, жазу, батырма — HTML (анық, өзгертуге оңай)
   • Ортада ЖИ-ми голограммасы мен робот-көмекші
══════════════════════════════════════════════════════════════ */
:root{--cy:#37e1ff;--ink:#06121a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Rubik',system-ui,'Segoe UI',sans-serif;color:#eaf6ff;overflow:hidden;-webkit-font-smoothing:antialiased;
  background:#0a1220 url("/static/img/toqsan4/lab/bg.webp") center / cover no-repeat}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 40%,rgba(3,8,20,.55))}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center}

/* ═══ HUD ═══ */
.brand{position:absolute;left:44px;top:30px;text-decoration:none;color:#fff}
.brand-name{position:relative;display:block;font-size:54px;font-weight:900;letter-spacing:-1px;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.brand-name b{background:linear-gradient(180deg,#c3eeff,#4fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-cap{position:absolute;left:-12px;top:-14px;width:46px;transform:rotate(-14deg)}
.brand-tag{display:block;margin-top:8px;font-size:15px;font-weight:700;letter-spacing:3px;color:#cfe2ff;text-shadow:0 2px 8px rgba(0,0,0,.6)}

.hud-r{position:absolute;right:40px;top:34px;display:flex;align-items:center;gap:16px}
.coin,.user{display:flex;align-items:center;gap:10px;height:56px;border-radius:999px;text-decoration:none;color:#fff;
  background:rgba(8,18,44,.78);border:1.5px solid rgba(120,170,255,.35);box-shadow:0 8px 22px rgba(0,0,0,.4);transition:background .15s}
.coin{padding:0 22px 0 8px;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.coin svg{width:42px;height:42px}
.user{padding:0 22px 0 7px;font-size:21px;font-weight:700}
.user img{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #fff}
.coin:hover,.user:hover{background:rgba(20,40,90,.9)}
.hud-sep{width:2px;height:34px;background:rgba(255,255,255,.4);border-radius:1px}

/* ═══ Баннер ═══ */
.banner{position:absolute;left:50%;top:40px;transform:translateX(-50%);text-align:center}
.banner-box{position:relative;padding:22px 64px 26px;border-radius:26px;
  background:linear-gradient(180deg,rgba(10,26,64,.92),rgba(6,14,38,.94));border:3px solid #3aa6ff;
  box-shadow:0 0 0 2px rgba(58,166,255,.25),0 0 36px rgba(58,166,255,.55),inset 0 0 30px rgba(58,166,255,.25)}
.banner-box::before,.banner-box::after{content:"";position:absolute;top:50%;width:20px;height:58px;margin-top:-29px;border-radius:6px;
  background:linear-gradient(180deg,#8fe3ff,#2f8cff);box-shadow:0 0 16px #37b4ff}
.banner-box::before{left:-12px}.banner-box::after{right:-12px}
.banner h1{font-size:54px;font-weight:900;line-height:1.08;letter-spacing:1px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#cfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(80,180,255,.6))}
.banner-sub{display:inline-block;margin-top:-16px;position:relative;padding:8px 26px;border-radius:999px;font-size:17px;font-weight:800;letter-spacing:2px;
  color:#7fe8ff;background:rgba(6,14,38,.95);border:2px solid #2f8cff;box-shadow:0 0 18px rgba(47,140,255,.5)}

/* ═══ Орталық: ЖИ миы + робот ═══ */
.brain{position:absolute;left:750px;top:238px;width:420px;pointer-events:none}
.brain img{width:100%;display:block;animation:brainFloat 5s ease-in-out infinite}
.brain-ai{position:absolute;left:50%;top:21.5%;transform:translateX(-50%);font-size:58px;font-weight:900;color:#fff;letter-spacing:1px;
  text-shadow:0 0 14px #37e1ff,0 0 30px #2f8cff;animation:brainFloat 5s ease-in-out infinite}
.brain-glow{position:absolute;left:12%;right:12%;bottom:6%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(55,200,255,.55),transparent 70%);filter:blur(10px);animation:pulse 2.6s ease-in-out infinite}
@keyframes brainFloat{50%{transform:translate(var(--tx,0),-10px)}}
.brain-ai{--tx:-50%}
@keyframes pulse{50%{opacity:.45}}

.robot{position:absolute;left:1150px;top:478px;width:128px;pointer-events:none;animation:bob 3.2s ease-in-out infinite}
.robot img{width:100%;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble{position:absolute;left:1196px;top:372px;width:172px;padding:12px 14px;border-radius:16px;text-align:center;
  font-size:18px;font-weight:700;line-height:1.25;color:#fff;background:rgba(8,18,44,.92);border:2px solid #37b4ff;
  box-shadow:0 0 18px rgba(55,180,255,.45);animation:bubbleIn .6s 1s cubic-bezier(.3,1.6,.5,1) both}
.bubble::after{content:"";position:absolute;left:24px;bottom:-11px;width:18px;height:18px;background:rgba(8,18,44,.92);
  border-right:2px solid #37b4ff;border-bottom:2px solid #37b4ff;transform:rotate(45deg)}
@keyframes bubbleIn{from{opacity:0;transform:scale(.5) translateY(14px)}}

/* ═══ Платформалар ═══ */
.pf{position:absolute;display:block;text-decoration:none;color:#fff;cursor:pointer;background:none;border:none;font:inherit;
  transform:translateX(-50%);--c:#37e1ff;--cr:55,225,255}
.pf-art{position:relative;display:block;width:100%}
.pf-art img{display:block;width:100%;filter:drop-shadow(0 18px 18px rgba(0,0,0,.5));transition:transform .25s cubic-bezier(.3,1.5,.5,1),filter .25s}
.pf-art::after{content:"";position:absolute;left:14%;right:14%;bottom:8%;height:26%;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse,rgba(var(--cr),.55),transparent 70%);filter:blur(12px);animation:pulse 3s ease-in-out infinite;animation-delay:var(--d,0s)}
.pf:hover .pf-art img,.pf:focus-visible .pf-art img{transform:translateY(-12px) scale(1.04);filter:drop-shadow(0 26px 22px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(var(--cr),.6))}
.pf:focus-visible{outline:none}
.pf-num{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;z-index:2;
  display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;background:#0a1430;border:4px solid var(--c);
  box-shadow:0 0 18px rgba(var(--cr),.75),inset 0 0 12px rgba(var(--cr),.45)}
.pf--hero .pf-num{color:#1d1300;background:radial-gradient(circle at 40% 35%,#fff3a8,#ffc21a 70%);border-color:#ffe27a}
.pf-done{position:absolute;left:calc(50% + 26px);top:-38px;z-index:3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#2ec865;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pf-label{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin:-46px auto 0;width:max-content;max-width:330px;
  padding:12px 12px 12px 22px;border-radius:16px;background:rgba(6,14,30,.9);border:2.5px solid var(--c);
  box-shadow:0 0 18px rgba(var(--cr),.45),0 10px 22px rgba(0,0,0,.45)}
.pf-text{font-size:20px;font-weight:700;line-height:1.22;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.pf-go{flex-shrink:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--c);
  border:2.5px solid var(--c);transition:background .2s,color .2s}
.pf-go svg{width:22px;height:22px}
.pf:hover .pf-go{background:var(--c);color:#06121a}
.pf-stars{display:flex;justify-content:center;gap:6px;margin-top:8px}
.pf-stars i{width:16px;height:16px;border-radius:4px;transform:rotate(45deg);background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3)}
.pf-stars i.on{background:#ffd24a;border-color:#fff3b0;box-shadow:0 0 8px rgba(255,210,74,.8)}

/* ═══ Терезе ═══ */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,8,20,.66);backdrop-filter:blur(4px)}
#overlay.show{display:flex}
.modal{position:relative;width:560px;max-width:100%;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#10223e,#081428);border:2px solid var(--mc,#37e1ff);box-shadow:0 30px 80px rgba(0,0,0,.7);
  animation:mIn .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes mIn{from{transform:translateY(18px) scale(.95);opacity:0}}
.modal-head{height:200px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 55%,rgba(var(--mcr,55,225,255),.25),transparent 65%)}
.modal-head img{height:180px;max-width:80%;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.modal-body{padding:6px 28px 26px}
.m-step{font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mc,#37e1ff)}
.m-title{font-size:25px;font-weight:900;margin:5px 0 10px;line-height:1.15}
.m-desc{font-size:15.5px;line-height:1.55;color:#c4d6ea}
.m-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}
.chip.done{color:#86efac;border-color:rgba(46,200,101,.5);background:rgba(46,200,101,.12)}
.m-start{display:block;width:100%;margin-top:20px;padding:15px;border:none;border-radius:14px;cursor:pointer;font:inherit;font-size:18px;font-weight:800;
  color:#06231a;background:linear-gradient(180deg,#7dffb0,#33c75e);box-shadow:0 8px 18px rgba(51,199,94,.4);transition:filter .2s}
.m-start:hover{filter:brightness(1.07)}
.m-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.35);color:#dff;font-size:24px;line-height:1}
.m-x:hover{background:rgba(0,0,0,.55)}

/* ═══ Телефон: сахнаның орнына тізім ═══ */
@media (max-width:760px),(max-height:430px){
  body{overflow:auto;background-attachment:fixed}
  #stage{position:static;width:auto;height:auto;transform:none!important;padding:16px 14px 90px}
  .brand,.hud-r,.banner{position:static;transform:none}
  .brand-name{font-size:34px}.brand-cap{width:30px;left:-8px;top:-10px}.brand-tag{font-size:10px;letter-spacing:2px}
  .hud-r{margin:14px 0 0;gap:8px}.coin{height:44px;font-size:18px}.coin svg{width:32px;height:32px}
  .user{height:44px;font-size:16px}.user img{width:32px;height:32px}.hud-sep{display:none}
  .banner{margin:20px 0 6px}.banner-box{padding:14px 18px 18px}.banner h1{font-size:25px}.banner-sub{font-size:11px;letter-spacing:1px;padding:6px 14px}
  .brain{position:relative;left:auto;top:auto;width:62%;margin:0 auto}.brain-ai{font-size:30px}
  .robot,.bubble{display:none}
  .pfs{display:grid;grid-template-columns:1fr 1fr;gap:34px 10px;margin-top:20px}
  .pf{position:relative;left:auto!important;top:auto!important;width:auto!important;transform:none}
  .pf-num{width:44px;height:44px;font-size:20px;top:-18px;border-width:3px}
  .pf-label{max-width:100%;margin-top:-24px;padding:8px 8px 8px 12px;gap:6px}.pf-text{font-size:13px}.pf-go{width:28px;height:28px}
}
</style>
</head>
<body>
{% set S = stars|default({}) %}
<div id="stage">

  <!-- ═══ HUD ═══ -->
  <a href="/student" class="brand" aria-label="BilimQuest — басты бет">
    <span class="brand-name">
      <svg class="brand-cap" viewBox="0 0 48 32" aria-hidden="true"><path d="M24 2L2 11l22 9 22-9z" fill="#fff"/><path d="M11 15.5v7c0 2.6 5.8 5 13 5s13-2.4 13-5v-7l-13 5.3z" fill="#dbe8ff"/><path d="M42 12.6v9.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="42" cy="23.6" r="2.4" fill="#ffd54a"/></svg>
      Bilim<b>Quest</b>
    </span>
    <span class="brand-tag">БІЛІМ • ТӘЖІРИБЕ • ЖЕТІСТІК</span>
  </a>

  <div class="hud-r">
    <a href="/rating" class="coin" title="Ұпай — рейтингті ашу">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="17" r="13" fill="#e49a0c"/><circle cx="16" cy="15.5" r="13" fill="#ffc62e"/><circle cx="16" cy="15.5" r="9.3" fill="#ffb31a" stroke="#fff3c2" stroke-opacity=".7" stroke-width="1.4"/><path d="M19.2 11.6c-.8-.9-2-1.4-3.4-1.4-2 0-3.3 1-3.3 2.5 0 3.3 7 1.7 7 5.1 0 1.6-1.5 2.6-3.6 2.6-1.5 0-2.9-.6-3.7-1.6M16 8.6v2M16 21v2" fill="none" stroke="#fff6d8" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>{{ "%.3f"|format(student.score) }}</span>
    </a>
    <span class="hud-sep"></span>
    <a href="/my_profile" class="user" title="Жеке парақша">
      <img src="{{ url_for('static', filename='img/user.png') }}" alt="">
      <span>{{ student.name }}</span>
    </a>
  </div>

  <!-- ═══ Баннер ═══ -->
  <div class="banner">
    <div class="banner-box"><h1>Жасанды интеллект<br>зертханасы</h1></div>
    <div class="banner-sub">ЗЕРТТЕ • ҮЙРЕН • ҚОЛДАН • БОЛАШАҚТЫ ҚҰР</div>
  </div>

  <!-- ═══ Орталық ═══ -->
  <div class="brain" aria-hidden="true">
    <div class="brain-glow"></div>
    <img src="{{ url_for('static', filename='img/toqsan4/lab/brain.webp') }}" alt="">
    <span class="brain-ai">AI</span>
  </div>
  <div class="robot" aria-hidden="true"><img src="{{ url_for('static', filename='img/toqsan4/lab/robot.webp') }}" alt=""></div>
  <div class="bubble">Болашақ бүгіннен басталады!</div>

  <!-- ═══ Платформалар ═══ -->
  <nav class="pfs" id="pfs" aria-label="Ойындар"></nav>
</div>

<!-- ═══ Ойын терезесі ═══ -->
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal">
    <button class="m-x" id="mX" aria-label="Жабу">&times;</button>
    <div class="modal-head"><img id="mImg" alt=""></div>
    <div class="modal-body">
      <div class="m-step" id="mStep"></div>
      <div class="m-title" id="mTitle"></div>
      <div class="m-desc" id="mDesc"></div>
      <div class="m-meta" id="mMeta"></div>
      <button class="m-start" id="mStart">Бастау</button>
    </div>
  </div>
</div>

<script>
const IMG="{{ url_for('static', filename='img/toqsan4/lab/') }}";
const STARS={{ S|tojson }};
const ARROW='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* x — платформа ортасы, y — үсті, w — ені (1920×1080 сахнасында) */
const PF=[
  {num:'', hero:true, img:'p_hero.webp', x:400, y:242, w:320, c:'#ffc21a', cr:'255,194,26', text:'Басты бет', href:'/student'},
  {num:'01', img:'p_storage.webp',  x:1530, y:290, w:320, c:'#2f8cff', cr:'47,140,255',  game:'Цифрлық детектив', route:'/toqsan4/g2',
   text:'Ақпараттың<br>тасымалдаушылары', title:'Ақпараттың цифрлық тасымалдаушылары',
   desc:'Цифрлық детектив: жоғалған файлдарды қауіпсіз жеткіз! Тасымалдаушыларды танып, дұрыс таңдау жаса, деректер кристалдарын жина.', tags:['Ойын','3 сахна','+0.20 ұпай']},
  {num:'02', img:'p_ergo.webp',     x:290, y:697, w:290, c:'#2ee86b', cr:'46,232,107',  game:'Эргономика', route:'/toqsan4/g1',
   text:'Компьютерде жұмыс<br>істеу қауіпсіздігі', title:'Компьютерде жұмыс істеу қауіпсіздігі',
   desc:'Кибер-эргономика: ЖИ-Көмекшіні «емде»! Дұрыс отыру, үзіліс, экран қашықтығы және электр қауіпсіздігі туралы 10 сұраққа жауап бер.', tags:['Ойын','10 сұрақ','+0.10 ұпай']},
  {num:'03', img:'p_internet.webp', x:740, y:673, w:290, c:'#b46bff', cr:'180,107,255', game:'Желілік жүгіруші', route:'/toqsan4/g3',
   text:'Интернеттегі<br>қауіпсіздік және этика', title:'Интернеттегі қауіпсіздік және этика',
   desc:'Кибер-Тұзақ: Желілік жүгіруші! Фишинг, күмәнді сілтемелер мен алаяқтардан секіріп өт, қауіпсіз сайттарды жина.', tags:['Раннер','3 деңгей','+0.30 ұпай']},
  {num:'04', img:'p_protect.webp',  x:1180, y:682, w:250, c:'#22d3a0', cr:'34,211,160',  game:'Кибер-бекініс', route:'/toqsan4/g4',
   text:'Ақпаратты қорғау<br>және парольдер', title:'Ақпаратты қорғау және парольдер',
   desc:'Кибер-Бекініс: базаны Пароль, Антивирус, Брандмауэр мұнараларымен қорша да фишинг, троян мен Ransomware толқындарын тойтар!', tags:['Стратегия','3 толқын','+0.30 ұпай']},
  {num:'05', img:'p_cloud.webp',    x:1630, y:714, w:290, c:'#37e1ff', cr:'55,225,255',  game:'Файл әлемі', route:'/toqsan4/g5',
   text:'Бұлттық сақтау<br>және ынтымақтастық', title:'Бұлттық сақтау және ынтымақтастық',
   desc:'Кибер-Аквариум: Файл Әлемі! Match-3 ойынынан кейін файлдарды папкаларға сұрыпта, бірлесе өңде және дұрыс құқықпен бөліс.', tags:['Match-3 + жұмыс кеңістігі','+0.30 ұпай']},
];
const GAMES=PF.filter(p=>p.game);

const box=document.getElementById('pfs');
PF.forEach((p,i)=>{
  const el=document.createElement(p.href?'a':'button'); el.className='pf'+(p.hero?' pf--hero':'');
  if(p.href) el.href=p.href; else el.type='button';
  el.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;--c:${p.c};--cr:${p.cr};--d:${(i*.4).toFixed(1)}s`;
  const st=p.game?(STARS[p.game]||0):0, played=p.game&&(p.game in STARS);
  el.innerHTML=`${p.num?`<span class="pf-num">${p.num}</span>`:''}${played?`<span class="pf-done" title="Өтілді">${CHK}</span>`:''}
    <span class="pf-art"><img src="${IMG+p.img}" alt=""></span>
    <span class="pf-label"><span class="pf-text">${p.text}</span><span class="pf-go">${ARROW}</span></span>
    ${p.game?`<span class="pf-stars" title="Жиналған белгілер: ${st}/3">${[0,1,2].map(k=>`<i class="${k<st?'on':''}"></i>`).join('')}</span>`:''}`;
  if(p.game) el.addEventListener('click',()=>openGame(p));
  box.appendChild(el);
});

/* ═══ терезе ═══ */
const ov=document.getElementById('overlay'), modal=document.getElementById('modal');
let cur=null;
function openGame(p){
  cur=p;
  modal.style.setProperty('--mc',p.c); modal.style.setProperty('--mcr',p.cr);
  document.getElementById('mImg').src=IMG+p.img;
  document.getElementById('mStep').textContent=`Блок ${GAMES.indexOf(p)+1} / ${GAMES.length}`;
  document.getElementById('mTitle').textContent=p.title;
  document.getElementById('mDesc').textContent=p.desc;
  const meta=document.getElementById('mMeta'); meta.innerHTML='';
  p.tags.forEach(t=>{const c=document.createElement('span'); c.className='chip'; c.textContent=t; meta.appendChild(c);});
  const played=p.game in STARS;
  if(played){const c=document.createElement('span'); c.className='chip done'; c.textContent='✓ Аяқталды'; meta.appendChild(c);}
  document.getElementById('mStart').textContent=played?'Қайта өту':'Бастау';
  ov.classList.add('show');
}
function close(){ ov.classList.remove('show'); cur=null; }
document.getElementById('mStart').onclick=()=>{ if(cur) location.href=cur.route; };
document.getElementById('mX').onclick=close;
ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

/* ═══ сахнаны экранға пропорционалды сыйғызу ═══ */
const stage=document.getElementById('stage');
function fit(){
  if(innerWidth<=760||innerHeight<=430){ stage.style.transform=''; return; }
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize',fit); fit();
</script>
