<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Кибер-бекініс — ЖИ зертханасы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Rubik',system-ui,'Segoe UI',Roboto,sans-serif;color:#e7ecff;background:#061318}
body{min-height:100vh}body{background:radial-gradient(ellipse 110% 55% at 50% -5%,rgba(20,140,120,.32),transparent 60%),radial-gradient(ellipse 90% 60% at 50% 110%,rgba(0,90,160,.2),transparent 60%),#061318;
  padding:60px 14px 20px;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hdr h1{font-size:21px;font-weight:900}
.stat{padding:8px 13px;border-radius:12px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:#8ff0d4;background:rgba(10,36,42,.92);border:1.5px solid rgba(34,211,160,.45)}
.prog{display:flex;gap:8px}
.prog i{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.1);transition:.3s}
.prog i.active{background:linear-gradient(90deg,#22d3a0,#37e1ff)}
.prog i.done{background:linear-gradient(90deg,#1e9e4a,#46e06a)}
.card{background:linear-gradient(180deg,rgba(14,34,48,.93),rgba(8,20,32,.97));border:1.5px solid rgba(60,180,160,.34);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.5px;padding:5px 13px;border-radius:20px;background:#12614f;color:#dffff4}
.bloom{font-size:12px;font-weight:700;color:#9fd8c8;margin:7px 0 10px}
.q{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:14px}
.q code{font-family:Consolas,monospace;color:#ffd24a}
.opt{display:block;width:100%;min-height:50px;margin-bottom:9px;padding:12px 15px;border-radius:13px;cursor:pointer;text-align:left;font:inherit;font-size:15px;font-weight:700;color:#e7ecff;
  background:rgba(20,44,60,.9);border:2px solid rgba(80,180,170,.3);transition:border-color .2s}
.opt.mono{font-family:Consolas,monospace;font-size:17px}
.opt:hover:not(:disabled){border-color:rgba(120,240,210,.8)}
.opt.sel{border-color:#37e1ff;background:rgba(20,60,90,.8)}
.opt.ok{border-color:#46e06a;background:rgba(20,70,40,.55)}
.opt.bad{border-color:#ef4444;background:rgba(70,20,24,.55)}
.opt:disabled{cursor:default}
.sub{font-size:14px;font-weight:700;color:#aebbe8;margin:6px 0 9px}
.note{margin:0 0 12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;background:rgba(20,50,70,.7);border:1.5px solid rgba(80,190,200,.35);color:#cfe9f2}
.btn{display:block;width:100%;min-height:50px;padding:13px;border:none;border-radius:13px;cursor:pointer;font:inherit;font-weight:800;font-size:16px;color:#06231a;background:linear-gradient(180deg,#7dffb0,#33c75e)}
.btn.alt{color:#e7ecff;background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.45;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.out{min-height:52px;padding:12px 14px;border-radius:12px;margin-bottom:11px;font-family:Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:1px;word-break:break-all;background:#07111c;border:1.5px solid rgba(255,255,255,.2)}
.parts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.part{min-width:58px;min-height:44px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:Consolas,monospace;font-size:16px;font-weight:700;color:#e7ecff;background:rgba(34,120,140,.35);border:1.5px solid rgba(90,210,210,.5)}
.part:hover{background:rgba(34,160,170,.5)}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;font-size:14px;font-weight:700}
.rules div{color:#ffb0b0}.rules div.ok{color:#7dffa0}
.row{display:flex;gap:9px}
.start{text-align:center;padding:26px 20px}
.start img{width:130px;margin-bottom:8px}
.start p{font-size:17px;font-weight:600;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>Кибер-бекініс</h1>
    <div class="stat">Балл: <span id="pts">0</span> / 10</div>
  </div>
  <div class="prog" id="prog"><i></i><i></i></div>
  <div class="card" id="scene"></div>
</div>

<script src="{{ url_for('static', filename='js/kronos.js') }}?v=3"></script>
<script>
/* ════════════════════════════════════════════════════════════
   Кибер-бекініс — 04 Ақпаратты қорғау және парольдер.
   1-кезең: Кроностың «qwerty123» бағасын тексеру (бағалау, 6 балл).
   2-кезең: берік құпиясөз құрастыру (қолдану, 4 балл).
════════════════════════════════════════════════════════════ */
const WHY=[
  {t:'Пернетақтадағы қатар тұрған әріптер оңай табылады',ok:true},
  {t:'Сөз тым ұзын'},
  {t:'Бас әріп пен арнайы таңба жоқ',ok:true},
  {t:'Ішінде сан бар'},
];
const STRONGEST=[{t:'Aida2013'},{t:'12345678'},{t:'Qyran#7_Tau!42',ok:true}];
const PARTS=['Aspan','kitap','Qyran','tau','7','42','2013','#','!','_'];
const RULES=[
  {t:'Кемінде 10 таңба',f:p=>p.length>=10},
  {t:'Бас әріп бар',f:p=>/[A-Z]/.test(p)},
  {t:'Сан бар',f:p=>/[0-9]/.test(p)},
  {t:'Арнайы таңба бар',f:p=>/[#!_]/.test(p)},
];
const bloom={koldanu:0,bagalau:0};
let lead='';
const el=document.getElementById('scene');
const pts=()=>{ document.getElementById('pts').textContent=String(bloom.koldanu+bloom.bagalau).replace('.',','); };
const prog=i=>[...document.getElementById('prog').children].forEach((b,k)=>b.className=k<i?'done':k===i?'active':'');

function start(){
  el.innerHTML=`<div class="start"><img src="/static/img/toqsan4/lab/robot.webp" alt="Кронос">
    <p>Кронос: «Зертхананың базасын құпиясөз қорғайды. Мен құпиясөзді тексердім, сен менің бағамды тексер!»</p>
    <button class="btn" id="go">Бастау</button></div>`;
  document.getElementById('go').onclick=stage1;
}

/* 1-кезең: бағалау */
function stage1(){
  prog(0);
  el.innerHTML=`<span class="badge">1-КЕЗЕҢ: Құпиясөзді бағалау</span><div class="bloom">Блум: Бағалау · 6 балл</div>
    <div class="q">Базаның құпиясөзі: <code>qwerty123</code></div><div id="b"></div>`;
  Kronos.ask({text:'Мен «qwerty123» құпиясөзін тексердім: ол берік. Базаны осымен қорғайық.',wrong:true,
    onAgree(){ lead=Kronos.wrongAgreed()?Kronos.PHRASE.wrong:''; reasons(); },
    onCheck(){ Kronos.caughtOne(); bloom.bagalau+=2; pts(); lead=Kronos.PHRASE.found; reasons(); }
  });
}
function reasons(){
  const b=document.getElementById('b'), picked=new Set();
  b.innerHTML=`<div class="sub">Неге бұл құпиясөз әлсіз? Дұрыс екі себепті белгіле.</div><div id="o"></div><button class="btn" id="n" disabled>Тексеру</button>`;
  const o=document.getElementById('o'), n=document.getElementById('n');
  WHY.forEach((x,i)=>{
    const e=document.createElement('button'); e.type='button'; e.className='opt'; e.textContent=x.t;
    e.onclick=()=>{ if(picked.has(i)) picked.delete(i); else if(picked.size<2) picked.add(i);
      [...o.children].forEach((q,k)=>q.classList.toggle('sel',picked.has(k))); n.disabled=picked.size!==2; };
    o.appendChild(e);
  });
  n.onclick=()=>{
    picked.forEach(i=>{ const ok=WHY[i].ok; if(ok) bloom.bagalau+=1; o.children[i].classList.remove('sel'); o.children[i].classList.add(ok?'ok':'bad'); }); pts();
    [...o.children].forEach(q=>q.disabled=true);
    n.textContent='Келесі сұрақ'; n.onclick=strongest;
  };
}
function strongest(){
  const b=document.getElementById('b');
  b.innerHTML=`<div class="sub">Үш құпиясөздің қайсысы ең берік?</div><div id="o"></div>`;
  const o=document.getElementById('o');
  STRONGEST.forEach(x=>{
    const e=document.createElement('button'); e.type='button'; e.className='opt mono'; e.textContent=x.t;
    e.onclick=()=>{
      [...o.children].forEach(q=>q.disabled=true); e.classList.add(x.ok?'ok':'bad');
      if(x.ok){ bloom.bagalau+=2; pts(); }
      b.insertAdjacentHTML('beforeend',`${lead?`<div class="note">${lead}</div>`:''}<button class="btn" id="nx">Келесі кезең</button>`);
      document.getElementById('nx').onclick=stage2;
    };
    o.appendChild(e);
  });
}

/* 2-кезең: қолдану */
function stage2(){
  prog(1);
  let pass='';
  el.innerHTML=`<span class="badge">2-КЕЗЕҢ: Берік құпиясөз құрастыру</span><div class="bloom">Блум: Қолдану · 4 балл</div>
    <div class="q">Бөліктерді басып, базаға жаңа құпиясөз жина. Әр орындалған шарт 1 балл береді.</div>
    <div class="out" id="out" aria-live="polite"></div><div class="parts" id="ps"></div><div class="rules" id="rs"></div>
    <div class="row"><button class="btn alt" id="clr">Тазалау</button><button class="btn" id="ok">Дайын</button></div>`;
  const draw=()=>{
    document.getElementById('out').textContent=pass;
    document.getElementById('rs').innerHTML=RULES.map(r=>`<div class="${r.f(pass)?'ok':''}">${r.f(pass)?'✓':'○'} ${r.t}</div>`).join('');
    document.getElementById('ok').disabled=!pass;
  };
  PARTS.forEach(p=>{
    const e=document.createElement('button'); e.type='button'; e.className='part'; e.textContent=p;
    e.onclick=()=>{ if(pass.length<24){ pass+=p; draw(); } };
    document.getElementById('ps').appendChild(e);
  });
  document.getElementById('clr').onclick=()=>{ pass=''; draw(); };
  document.getElementById('ok').onclick=()=>{
    const met=RULES.filter(r=>r.f(pass)).length;
    bloom.koldanu=met; pts();
    Kronos.show(met===4?'Бұл құпиясөз шынымен берік. Базаны қорғауға болады!':`Бұл құпиясөз ${met}/4 шартты орындады. Құпиясөзді әрқашан шарттармен тексер.`,{button:'Нәтижені көру',onClose:finish});
  };
  draw();
}

function finish(){
  prog(2);
  bqFinish({game_name:'Кибер-бекініс', score:bloom.koldanu+bloom.bagalau, bloom, bloom_max:{koldanu:4,bagalau:6},
    kronos:Kronos.summary(), title:'База қорғалды!', backUrl:'/toqsan_4'});
}
pts(); prog(-1); start();
</script>
{% include '_win_modal.html' %}
</body>
</html>
