<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Кибер-Бекініс — Қауіпсіз База</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Rubik',system-ui,'Segoe UI',Roboto,sans-serif;color:#e7ecff;background:#05070f;overflow:hidden}
body{background:
  radial-gradient(ellipse 100% 60% at 50% -5%,rgba(40,30,150,.35),transparent 60%),
  radial-gradient(ellipse 80% 50% at 50% 110%,rgba(0,90,180,.2),transparent 60%),#05070f}

/* HUD top */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px;padding:0 14px;flex-wrap:nowrap;
  background:linear-gradient(180deg,rgba(10,16,44,.96),rgba(6,10,30,.96));border-bottom:1.5px solid rgba(80,140,255,.3)}
.agent{display:flex;align-items:center;gap:10px}
.hud-back{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 13px 0 9px;border-radius:10px;text-decoration:none;
  font-size:12.5px;font-weight:800;color:#c7d6ff;background:rgba(80,140,255,.12);border:1px solid rgba(120,160,255,.4);transition:background .15s}
.hud-back:hover{background:rgba(80,140,255,.25)}
.hud-back svg{width:15px;height:15px}
.ava{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:radial-gradient(circle at 38% 30%,#2a4a9a,#0e1844);border:1.5px solid rgba(120,160,255,.5)}
.ag-meta{font-size:12px;font-weight:800;line-height:1.2}.ag-meta b{font-size:13px}.ag-lvl{color:#8fb3ff;font-size:10.5px}
.hud-mid{flex:1;max-width:320px;text-align:center}
.def-label{font-size:10.5px;font-weight:800;color:#9fb0e8;letter-spacing:.5px}
.def-track{height:13px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.1);margin-top:3px}
.def-fill{height:100%;border-radius:7px;width:100%;background:linear-gradient(90deg,#1e9e4a,#46e06a,#7dffa0);
  box-shadow:0 0 12px rgba(70,224,106,.6);transition:width .25s}
.def-fill.warn{background:linear-gradient(90deg,#b45309,#f59e0b)}
.def-fill.crit{background:linear-gradient(90deg,#b42020,#ef4444)}
.hud-right{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:13px;font-weight:900;font-size:14px;
  background:linear-gradient(180deg,rgba(20,34,76,.92),rgba(12,20,52,.95));border:1.5px solid rgba(90,120,210,.4)}
.pill.energy{color:#7be0ff;border-color:rgba(80,200,255,.45)}
.pill.star{color:#ffd24a;border-color:rgba(255,200,60,.4)}

/* stage */
.stage{display:flex;height:calc(100vh - 58px - 92px);gap:10px;padding:10px 12px;overflow:hidden}
.board-wrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;
  border-radius:16px;overflow:hidden;border:1.5px solid rgba(80,140,255,.25);
  background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(20,40,90,.5),rgba(4,8,22,.95))}
#board{display:block;max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}

/* Kronos chat */
.kronos{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(12,20,52,.95),rgba(7,11,32,.96));border:1.5px solid rgba(90,120,210,.3)}
.kr-head{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid rgba(90,120,210,.25);
  background:linear-gradient(180deg,rgba(30,46,110,.6),transparent)}
.kr-head .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;
  background:radial-gradient(circle at 40% 32%,#2a3a8a,#0e1640);border:1px solid rgba(120,150,255,.5)}
.kr-head b{font-size:13px}.kr-head div{font-size:10px;color:#8fb3ff}
.kr-log{flex:1;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:9px}
.kr-log::-webkit-scrollbar{width:4px}.kr-log::-webkit-scrollbar-thumb{background:rgba(120,150,255,.3);border-radius:2px}
.kmsg{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kmsg .av{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:radial-gradient(circle at 40% 32%,#2a3a8a,#0e1640);border:1px solid rgba(120,150,255,.4)}
.kmsg .bub{flex:1;font-size:12px;line-height:1.42;font-weight:600;padding:8px 11px;border-radius:11px;
  background:linear-gradient(180deg,rgba(24,34,78,.95),rgba(16,24,58,.97));border:1px solid rgba(90,120,210,.3);color:#dbe4ff;border-bottom-left-radius:4px}
.kmsg.warn .bub{border-color:rgba(251,191,36,.5);color:#fde8b0}
.kmsg.alert .bub{border-color:rgba(239,68,68,.55);color:#ffc9c9;background:linear-gradient(180deg,rgba(50,18,22,.95),rgba(30,10,14,.97))}
.kmsg.good .bub{border-color:rgba(70,224,106,.5);color:#c2f5d2}

/* bottom: shop + actions */
.dock{height:92px;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,rgba(10,16,44,.96),rgba(6,10,30,.97));border-top:1.5px solid rgba(80,140,255,.3)}
.shop{flex:1;display:flex;gap:8px;overflow-x:auto}
.tower-btn{flex:1;min-width:120px;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:13px;cursor:pointer;
  background:linear-gradient(180deg,rgba(22,32,74,.9),rgba(14,20,50,.95));border:2px solid var(--tc,#6d5dfc);
  transition:transform .12s,box-shadow .2s;position:relative}
.tower-btn:hover:not(.dis){transform:translateY(-2px);box-shadow:0 6px 16px rgba(var(--tcr),.4)}
.tower-btn.armed{box-shadow:0 0 0 2px var(--tc),0 0 18px rgba(var(--tcr),.6)}
.tower-btn.dis{opacity:.45;cursor:not-allowed}
.tb-ico{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:21px;
  background:rgba(var(--tcr),.18);border:1px solid var(--tc)}
.tb-meta{min-width:0}.tb-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-cost{font-size:11px;font-weight:800;color:#7be0ff;margin-top:1px}
.act{display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.abtn{padding:11px 16px;border:none;border-radius:13px;cursor:pointer;font-family:inherit;font-weight:900;font-size:14px;color:#fff;
  white-space:nowrap;transition:transform .12s,filter .2s}
.abtn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.abtn:disabled{opacity:.5}
.abtn.attack{background:linear-gradient(180deg,#ef4444,#b42030);box-shadow:0 6px 16px rgba(239,68,68,.4)}
.abtn.back{background:linear-gradient(180deg,#3a4a7a,#222c52);font-size:12px;padding:9px 14px}

/* result overlay */
.result{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,6,16,.88);backdrop-filter:blur(6px)}
.result.show{display:flex}
.rcard{position:relative;max-width:480px;width:100%;padding:30px;border-radius:24px;text-align:center;
  background:linear-gradient(160deg,rgba(16,26,72,.99),rgba(7,11,30,.99));border:2px solid rgba(120,180,255,.5);
  box-shadow:0 0 70px rgba(60,120,255,.3);transform:scale(.85) translateY(16px);opacity:0;transition:.4s cubic-bezier(.34,1.56,.64,1)}
.result.show .rcard{transform:scale(1) translateY(0);opacity:1}
.r-medal{font-size:60px;margin-bottom:6px;animation:trophyB .7s ease}
@keyframes trophyB{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.r-title{font-size:23px;font-weight:900}.r-sub{font-size:12px;font-weight:800;color:#8ee6ff;letter-spacing:.6px;margin-bottom:8px}
.r-defbar{height:16px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.1);margin:10px 0 4px}
.r-deffill{height:100%;border-radius:9px;background:linear-gradient(90deg,#1e9e4a,#46e06a);width:0;transition:width 1s ease .2s}
.r-defpct{font-weight:900;font-size:15px;color:#7dffa0;margin-bottom:12px}
.r-audit{text-align:left;font-size:12.5px;line-height:1.5;color:#cdd8f5;background:rgba(0,229,255,.05);
  border:1px solid rgba(90,180,255,.25);border-radius:13px;padding:12px 14px;margin-bottom:16px}
.r-audit b{color:#8ee6ff}.r-crys{font-size:17px;font-weight:900;color:#8ee6ff;margin-bottom:14px}
.r-btns{display:flex;gap:9px}
.r-btn{flex:1;padding:14px;border:none;border-radius:13px;cursor:pointer;font-family:inherit;font-weight:900;font-size:15px}
.r-btn.retry{background:rgba(255,255,255,.1);color:#cfe7ef;border:1px solid rgba(255,255,255,.2)}
.r-btn.go{color:#06231a;background:linear-gradient(180deg,#7dffa0,#33c75e)}
.r-btn:hover{filter:brightness(1.07)}
.confetti{position:fixed;top:-12px;z-index:210;pointer-events:none;animation:cFall linear forwards}
@keyframes cFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media(max-width:820px){
  .stage{flex-direction:column;height:auto;overflow:visible}
  .kronos{width:100%;height:200px}
  body{overflow:auto}
}
</style>
</head>
<body>

<!-- HUD -->
<div class="hud">
  <div class="agent">
    <a href="/toqsan_4" class="hud-back" title="Модульге оралу"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Артқа</a>
    <div class="ava" id="agentAva"></div>
    <div class="ag-meta"><b>АГЕНТ</b><div class="ag-lvl">Кибер-бекініс</div></div>
  </div>
  <div class="hud-mid">
    <div class="def-label" style="display:flex;align-items:center;justify-content:center;gap:5px"><span id="serverIco" style="display:inline-flex"></span> БАС СЕРВЕР ҚОРҒАУЫ — <span id="defPct">100%</span></div>
    <div class="def-track"><div class="def-fill" id="defFill"></div></div>
  </div>
  <div class="hud-right">

</div>

<!-- STAGE -->
<div class="stage">

    <canvas id="board" width="620" height="500"></canvas>
  </div>
  <div class="kronos" style="display:none">
    <div class="kr-head"><div class="ico" id="kronosIco"></div><div><b>ЖИ Кеңесші Кронос</b><div>Стратегиялық талдау</div></div></div>
    <div class="kr-log" id="krLog"></div>
  </div>
</div>

<!-- DOCK -->
<div class="dock">
  <div class="shop" id="shop"></div>

  </div>
</div>

<!-- RESULT -->
<div class="result" id="result">
  <div class="rcard">
    <div class="r-medal" id="rMedal">🛡️</div>

    <div class="r-sub" id="rSub"></div>
    <div class="r-defbar"><div class="r-deffill" id="rDefFill"></div></div>
    <div class="r-defpct" id="rDefPct"></div>
    <div class="r-audit" id="rAudit"></div>
    <div class="r-crys" id="rCrys"></div>
    <div class="r-btns" id="rBtns"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   3-ОЙЫН: Кибер-Бекініс (Tower Defense)
   Интернеттегі қауіпсіздік. Мұнара орналастыр → 3 толқынды тойтар.
════════════════════════════════════════════════════════════ */
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height, CELL=50;

/* ════════════════════════════════════════════════════════════
   HUD ИКОНКАЛАРЫ — агент, Кронос, сервер белгісі.
   (Мұнаралар мен жаулар енді drawTowerArt/drawEnemyArt арқылы
    толық суреттеледі — оларға жеке иконка керек емес.)
════════════════════════════════════════════════════════════ */
const ICONS = {
  agent:[    {d:'M4.5 10.8 C4.5 9.6 7.9 8.6 12 8.6 C16.1 8.6 19.5 9.6 19.5 10.8 C19.5 12 16.1 11.6 12 11.6 C7.9 11.6 4.5 12 4.5 10.8 Z',op:'fill'},
             {d:'M8.8 9 C8.8 6.5 10.2 4.8 12 4.8 C13.8 4.8 15.2 6.5 15.2 9 Z',op:'fill'},
             {d:'M7.7 12.2 a4.3 4.3 0 1 0 8.6 0.001 a4.3 4.3 0 1 0 -8.6 0 Z',op:'fillFaint'},
             {d:'M8.3 12.6 h7.4 v1.7 h-7.4 Z',op:'fillDark'} ],
  kronos:[   {d:'M6 8 C6 6.9 6.9 6 8 6 H16 C17.1 6 18 6.9 18 8 V16 C18 17.1 17.1 18 16 18 H8 C6.9 18 6 17.1 6 16 Z',op:'fill'},
             {d:'M12 6 V3.2',op:'stroke'},
             {d:'M11.2 2 h1.6 v1.6 h-1.6 Z M9.2 10.6 h1.9 v1.9 h-1.9 Z M12.9 10.6 h1.9 v1.9 h-1.9 Z',op:'fillDark'},
             {d:'M9.4 14.6 h5.2',op:'strokeDark'} ],
  server:[   {d:'M7 3 H17 C17.55 3 18 3.45 18 4 V20 C18 20.55 17.55 21 17 21 H7 C6.45 21 6 20.55 6 20 V4 C6 3.45 6.45 3 7 3 Z',op:'fill'},
             {d:'M8.5 8 H15.5 M8.5 12 H15.5 M8.5 16 H15.5',op:'strokeDark'},
             {d:'M16 7.3 h1 v1 h-1 Z M16 11.3 h1 v1 h-1 Z M16 15.3 h1 v1 h-1 Z',op:'fillDark'} ],
};
/* HTML нұсқасы: <svg> жинау (dock/HUD элементтеріне innerHTML ретінде) */
function iconSVG(name,color,size){
  const parts = ICONS[name]||[];
  let inner='';
  for(const p of parts){
    if(p.lines){
      const c = p.op==='strokeSelf'?color:'rgba(255,255,255,.85)';
      for(const ln of p.lines) inner+=`<line x1="${ln.x1}" y1="${ln.y1}" x2="${ln.x2}" y2="${ln.y2}" stroke="${c}" stroke-width="1.4" stroke-linecap="round"/>`;
      continue;
    }
    if(p.op==='fill') inner+=`<path d="${p.d}" fill="${color}"/>`;
    else if(p.op==='fillFaint') inner+=`<path d="${p.d}" fill="rgba(255,255,255,.18)"/>`;
    else if(p.op==='fillDark') inner+=`<path d="${p.d}" fill="rgba(6,10,26,.85)"/>`;
    else if(p.op==='fillSelf') inner+=`<path d="${p.d}" fill="${color}"/>`;
    else if(p.op==='cut') inner+=`<path d="${p.d}" fill="rgba(6,10,26,.9)"/>`;
    else if(p.op==='stroke') inner+=`<path d="${p.d}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if(p.op==='strokeDark') inner+=`<path d="${p.d}" fill="none" stroke="rgba(6,10,26,.85)" stroke-width="1.4" stroke-linecap="round"/>`;
    else if(p.op==='strokeSelf') inner+=`<path d="${p.d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
/* Canvas нұсқасы: Path2D арқылы бірдей path-терді тақтаға сызу */
const _path2dCache={};
function _p2d(d){ return _path2dCache[d] || (_path2dCache[d]=new Path2D(d)); }
function drawIcon(name,x,y,size,color){
  const parts = ICONS[name]||[]; if(!parts.length) return;
  ctx.save();
  ctx.translate(x-size/2, y-size/2); ctx.scale(size/24, size/24);
  for(const p of parts){
    if(p.lines){
      ctx.strokeStyle = p.op==='strokeSelf'?color:'rgba(255,255,255,.85)';
      ctx.lineWidth=1.4; ctx.lineCap='round';
      for(const ln of p.lines){ ctx.beginPath(); ctx.moveTo(ln.x1,ln.y1); ctx.lineTo(ln.x2,ln.y2); ctx.stroke(); }
      continue;
    }
    const path=_p2d(p.d);
    if(p.op==='fill'||p.op==='fillSelf'){ ctx.fillStyle=color; ctx.fill(path); }
    else if(p.op==='fillFaint'){ ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fill(path); }
    else if(p.op==='fillDark'||p.op==='cut'){ ctx.fillStyle='rgba(6,10,26,.9)'; ctx.fill(path); }
    else if(p.op==='stroke'){ ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke(path); }
    else if(p.op==='strokeDark'){ ctx.strokeStyle='rgba(6,10,26,.85)'; ctx.lineWidth=1.4; ctx.lineCap='round'; ctx.stroke(path); }
    else if(p.op==='strokeSelf'){ ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.lineCap='round'; ctx.stroke(path); }
  }
  ctx.restore();
}

/* ── server ── */
const SERVER={x:W/2, y:H/2, r:30, hp:100, maxhp:100};

/* ── paths (pixel waypoints; enemies spawn at [0] → reach server) ── */
const PATHS=[
  [{x:-20,y:90},{x:150,y:90},{x:150,y:H/2},{x:SERVER.x-44,y:SERVER.y}],
  [{x:W+20,y:H-90},{x:W-150,y:H-90},{x:W-150,y:H/2},{x:SERVER.x+44,y:SERVER.y}],
  [{x:W/2,y:-20},{x:W/2,y:120},{x:SERVER.x,y:SERVER.y-44}],
];

/* ── towers catalog ── */
const TOWERS={
  password: {name:'Пароль Қалқаны', cost:50,  color:'#6d5dfc', cr:'109,93,252', range:78, kind:'slow', slow:.5,
             tip:'жақын хакерлердің жылдамдығын 50%-ға баяулатады'},
  antivirus:{name:'Антивирус Лазері', cost:100, color:'#37e1ff', cr:'55,225,255', range:96, kind:'laser', dps:30,
             tip:'радиустағы вирустарды лазермен жояды'},
  firewall: {name:'Брандмауэр', cost:75,  color:'#ff7a3c', cr:'255,122,60', range:64, kind:'gun', dps:46,
             tip:'порталдан келетін зиянды трафикке күшті соққы береді'},
  backup:   {name:'Backup Мұнарасы', cost:120, color:'#9be0ff', cr:'155,224,255', range:0, kind:'heal', heal:6,
             tip:'Бас Сервердің өмірін (HP) қалпына келтіреді'},
};

/* ── state ── */
let energy=300, towers=[], enemies=[], shots=[], particles=[];
let armed=null, ghost=null;
let phase='build';          // build | attack | over
let waveIdx=0, spawnQ=[], spawnT=0, started=false;
let lastT=0, gameOver=false;

/* ── shop UI ── */
const shopEl=document.getElementById('shop');
Object.entries(TOWERS).forEach(([k,t])=>{
  const b=document.createElement('div'); b.className='tower-btn'; b.id='tb_'+k;
  b.style.setProperty('--tc',t.color); b.style.setProperty('--tcr',t.cr);
  b.innerHTML=`<div class="tb-ico"><img src="${towerThumb(k)}" width="34" height="34" alt=""></div><div class="tb-meta"><div class="tb-name">${t.name}</div><div class="tb-cost">⚡ ${t.cost} э.</div></div>`;
  b.onclick=()=>arm(k);
  shopEl.appendChild(b);
});
function arm(k){
  if(gameOver) return;
  if(energy<TOWERS[k].cost){ kron('alert','⚡ Энергия жеткіліксіз! Алдымен арзанырақ мұнара қой.'); return; }
  armed = armed===k ? null : k;
  document.querySelectorAll('.tower-btn').forEach(el=>el.classList.toggle('armed', el.id==='tb_'+armed));
}
function refreshShop(){
  Object.entries(TOWERS).forEach(([k,t])=>document.getElementById('tb_'+k).classList.toggle('dis', energy<t.cost));
}

/* ── geometry helpers ── */
function distToSeg(px,py,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  let t=l2? ((px-a.x)*dx+(py-a.y)*dy)/l2 : 0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a.x+dx*t), py-(a.y+dy*t));
}
function distToPaths(x,y){
  let m=1e9;
  for(const p of PATHS) for(let i=0;i<p.length-1;i++) m=Math.min(m, distToSeg(x,y,p[i],p[i+1]));
  return m;
}
function snap(x,y){ return { x:Math.floor(x/CELL)*CELL+CELL/2, y:Math.floor(y/CELL)*CELL+CELL/2 }; }
function buildable(x,y){
  if(x<20||x>W-20||y<20||y>H-20) return false;       // в пределах поля (по радиусу башни)
  if(Math.hypot(x-SERVER.x,y-SERVER.y)<SERVER.r+22) return false; // не на сервере
  if(distToPaths(x,y)<22) return false;              // не на пути (визуальная ширина пути ~17)
  if(towers.some(t=>Math.hypot(t.x-x,t.y-y)<40)) return false;    // не поверх другой башни
  return true;
}

/* ── pointer placement ── */
function evtXY(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; }
cv.addEventListener('mousemove',e=>{ if(!armed){ghost=null;return;} const p=evtXY(e); ghost={x:p.x,y:p.y}; });
cv.addEventListener('mouseleave',()=>ghost=null);
cv.addEventListener('click',e=>{ const p=evtXY(e); place(p.x,p.y); });
cv.addEventListener('touchstart',e=>{ if(!armed)return; e.preventDefault(); const p=evtXY(e); ghost={x:p.x,y:p.y}; place(p.x,p.y); },{passive:false});

const TR=20;  // радиус башни для проверок размещения
function place(x,y){
  if(!armed||gameOver) return;
  const t=TOWERS[armed];
  // ставим ровно туда, куда нажали (только подправляем, чтобы башня не вылезала за поле)
  const px=Math.max(TR,Math.min(W-TR,x)), py=Math.max(TR,Math.min(H-TR,y));
  if(!buildable(px,py)){ kron('warn','⚠️ Мұнда қою мүмкін емес — жол не серверге тым жақын, немесе орын бос емес. Жанындағы бос жерге қойып көр.'); return; }
  if(energy<t.cost){ kron('alert','⚡ Энергия жеткіліксіз!'); return; }
  energy-=t.cost;
  const tw={type:armed,x:px,y:py,cd:0,aim:-Math.PI/2,fireT:0,born:performance.now(),...t};
  towers.push(tw);
  updateEnergy(); refreshShop();
  placeFeedback(tw);
  ghost=null;
  bink(px,py,t.color);
  if(energy<TOWERS[armed].cost){ armed=null; document.querySelectorAll('.tower-btn').forEach(el=>el.classList.remove('armed')); }
}

/* ── Kronos placement coaching (Bloom levels) ── */
function placeFeedback(tw){
  const nearPortal = PATHS.some(p=>Math.hypot(tw.x-p[0].x,tw.y-p[0].y)<150);
  const nearPath = distToPaths(tw.x,tw.y)<60;
  if(tw.type==='firewall'){
    if(nearPortal) kron('good','🔥 Өте ақылды шешім! Брандмауэр сыртқы шабуылды ең бірінші тексеретін сүзгі. Оны кіреберіс порталға қойғаның қауіпсіздікті +25%-ға арттырды! ⚡');
    else kron('','🔥 Брандмауэр қойылды. Ең тиімдісі — оны порталдың кіреберісіне қою.');
  } else if(tw.type==='antivirus'){
    if(nearPath) kron('good','🛡️ Дұрыс! Антивирус лазерін файлдар жиі өтетін жолға жақын қойдың — ол вирустарды тиімді жояды.');
    else kron('warn','⚠️ Назар аудар! Тым алыс бұрышқа қойылған Антивирус вирустарды көре алмайды. Оны орталық жолдарға жақын орналастыр! 🛡️');
  } else if(tw.type==='password'){
    kron('','🔐 Пароль Қалқаны хакерлерді баяулатады — оны жол бойына қойғаның дұрыс.');
  } else if(tw.type==='backup'){
    kron('good','☁️ Backup мұнарасы қосылды! Енді вирус серверге жетсе де, ол деректер өмірін қалпына келтіреді. Әсіресе Боссқа қарсы өте маңызды!');
  }
}

/* ── waves ── */
const WAVES=[
  { n:'Фишингтік шпиондар', t:'phish', count:10, gap:.7,
    sig:['alert','🚨 1-Толқын — Фишинг шабуылы! Хакерлер жалған сілтемелер мен ұтыс ойындары кейпінде кіруге тырысуда. Пароль орталығына жеткізбе!'] },
  { n:'Троян вирусы', t:'trojan', count:8, gap:.95,
    sig:['alert','🦠 2-Толқын — Троян! Ол өзін қауіпсіз ойын ретінде таныстырады. Оны тек Антивирус лазері ғана таниды!'] },
  { n:'Босс: Ransomware', t:'boss', count:1, gap:1, adds:5,
    sig:['alert','💀 3-Толқын — БОСС! Хакер-Шифрлаушы Бас Серверді бұзып, деректерді құлыптамақ! Тезірек Backup мұнарасын іске қос!'] },
];
const ETYPE={
  phish: {hp:20, sp:62, dmg:6,  r:11, col:'#ffd24a'},
  trojan:{hp:48, sp:46, dmg:11, r:13, col:'#b06bff'},
  boss:  {hp:420,sp:30, dmg:42, r:24, col:'#ff4d4d'},
};
let betweenWaves=false;

document.getElementById('attackBtn').onclick=startAttack;
function startAttack(){
  if(phase!=='build'||gameOver) return;
  if(towers.length===0){ kron('warn','⚠️ Алдымен кемінде бір қорғаныс мұнарасын қой!'); return; }
  phase='attack'; started=true; waveIdx=0;
  document.getElementById('attackBtn').disabled=true;
  document.getElementById('attackBtn').textContent='⚔️ Шайқас жүріп жатыр...';
  beginWave(0);
}
function beginWave(i){
  const w=WAVES[i];
  kron(w.sig[0], w.sig[1]);
  beep(i===2?180:330);
  spawnQ=[];
  for(let k=0;k<w.count;k++) spawnQ.push(w.t);
  if(w.adds) for(let k=0;k<w.adds;k++) spawnQ.push('phish');
  spawnT=0.4;
}
function spawnEnemy(type){
  const path=PATHS[Math.floor(Math.random()*PATHS.length)];
  const e=ETYPE[type];
  enemies.push({type,x:path[0].x,y:path[0].y,wp:1,path,hp:e.hp,maxhp:e.hp,sp:e.sp,dmg:e.dmg,r:e.r,slow:1,slowT:0,ang:0,seed:Math.random()*6.28});
}

/* ── main loop ── */
function loop(ts){
  const dt=Math.min(.05,(ts-(lastT||ts))/1000); lastT=ts;
  if(phase==='attack' && !gameOver) update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  // spawn
  if(spawnQ.length){ spawnT-=dt; if(spawnT<=0){ spawnEnemy(spawnQ.shift()); spawnT=WAVES[waveIdx].gap; } }
  // towers
  for(const t of towers){
    t.cd-=dt;
    if(t.kind==='heal'){ if(SERVER.hp<SERVER.maxhp){ SERVER.hp=Math.min(SERVER.maxhp,SERVER.hp+t.heal*dt); updateDef(); } continue; }
    if(t.kind==='slow'){ for(const e of enemies){ if(Math.hypot(e.x-t.x,e.y-t.y)<t.range){ e.slow=t.slow; e.slowT=.25; } } continue; }
    // laser / gun: target nearest in range
    let tg=null,best=1e9;
    for(const e of enemies){ const d=Math.hypot(e.x-t.x,e.y-t.y); if(d<t.range&&d<best){best=d;tg=e;} }
    if(tg){
      // мұнара оқпаны нысанаға бұрылады (жұмсақ бұрылыс)
      const want=Math.atan2(tg.y-t.y, tg.x-t.x);
      let diff=((want-t.aim+Math.PI*3)%(Math.PI*2))-Math.PI;
      t.aim+=diff*Math.min(1, dt*9);
      t.fireT=0.12;
      tg.hp-=t.dps*dt; shots.push({x1:t.x,y1:t.y,x2:tg.x,y2:tg.y,col:t.color,life:.08});
      if(tg.hp<=0) killEnemy(tg);
    }
    if(t.fireT>0) t.fireT-=dt;
  }
  // enemies move
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0)e.slow=1;}
    const wp=e.path[e.wp];
    if(!wp){ // reached server
      SERVER.hp=Math.max(0,SERVER.hp-e.dmg); updateDef(); hitServer();
      enemies.splice(i,1); continue;
    }
    const dx=wp.x-e.x, dy=wp.y-e.y, d=Math.hypot(dx,dy), step=e.sp*e.slow*dt;
    e.ang=Math.atan2(dy,dx);          // қозғалыс бағыты (із бен силуэт үшін)
    if(d<=step){ e.x=wp.x; e.y=wp.y; e.wp++; }
    else { e.x+=dx/d*step; e.y+=dy/d*step; }
    if(SERVER.hp<=0){ endGame(); return; }
  }
  // shots/particles decay
  for(let i=shots.length-1;i>=0;i--){ shots[i].life-=dt; if(shots[i].life<=0) shots.splice(i,1); }
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx;p.y+=p.vy;p.life-=dt; if(p.life<=0)particles.splice(i,1); }
  // wave progression
  if(spawnQ.length===0 && enemies.length===0 && phase==='attack' && !betweenWaves){
    if(waveIdx<WAVES.length-1){
      betweenWaves=true;
      setTimeout(()=>{ if(!gameOver){ waveIdx++; beginWave(waveIdx); betweenWaves=false; } },1000);
    } else endGame();
  }
}
function killEnemy(e){
  const i=enemies.indexOf(e); if(i>=0)enemies.splice(i,1);
  for(let k=0;k<8;k++){const a=Math.random()*6.28,s=40+Math.random()*60;particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s/60,vy:Math.sin(a)*s/60,life:.5,col:ETYPE[e.type].col});}
  beep(660,.05);
}

/* ══════════════════════════════════════════════════════════════════
   ДИЗАЙН ЖҮЙЕСІ (тақта + дүкен үшін бір дереккөз)
   • Пішін DNA : сегіз қырлы іргетас + squircle корпус
   • Материал  : матау графит қаңқа / түсті жылтыр қаптама / эмиссивті өзек
   • Жарық     : жоғары-солдан, түйіскен жерлерде AO
   • Әр мұнараның ӨЗ силуэті: пилон / турель / бастион / тарелка
══════════════════════════════════════════════════════════════════ */
function rrC(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function polyC(c,cx,cy,r,sides,rot){
  c.beginPath();
  for(let i=0;i<=sides;i++){const a=rot+(i/sides)*Math.PI*2,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
    i===0?c.moveTo(px,py):c.lineTo(px,py);}
  c.closePath();
}

/* ── Мұнараның ортақ іргетасы: жерге «орнатылған» сезім ── */
function towerBase(c,x,y,s,rgb){
  const R=19*s;
  c.fillStyle='rgba(0,0,0,.4)';
  c.beginPath(); c.ellipse(x,y+R*0.44,R*0.95,R*0.34,0,0,6.28); c.fill();
  c.fillStyle='#0f1830'; polyC(c,x,y,R,8,Math.PI/8); c.fill();
  const g=c.createLinearGradient(x-R,y-R,x+R,y+R);
  g.addColorStop(0,'rgba(255,255,255,.4)'); g.addColorStop(.5,`rgba(${rgb},.55)`); g.addColorStop(1,'rgba(0,0,0,.5)');
  c.strokeStyle=g; c.lineWidth=2*s; polyC(c,x,y,R,8,Math.PI/8); c.stroke();
  c.fillStyle='#18234a'; polyC(c,x,y,R*0.73,8,Math.PI/8); c.fill();
  c.strokeStyle='rgba(0,0,0,.45)'; c.lineWidth=1.2*s; polyC(c,x,y,R*0.73,8,Math.PI/8); c.stroke();
  c.fillStyle='rgba(0,0,0,.5)';
  for(let i=0;i<4;i++){const a=Math.PI/4+i*Math.PI/2;
    c.beginPath(); c.arc(x+Math.cos(a)*R*0.84,y+Math.sin(a)*R*0.84,1.7*s,0,6.28); c.fill();}
}
/* ── Түсті қаптама градиенті (жарық жоғары-солдан) ── */
function shellGrad(c,x,y,r,accent){
  const g=c.createLinearGradient(x-r,y-r,x+r,y+r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.18,accent); g.addColorStop(1,'#0b1030');
  return g;
}

/* ══ МҰНАРА СУРЕТІ — тақтада да, дүкенде де осы функция ══ */
function drawTowerArt(c,kind,x,y,s,tms,aim,accent,rgb,fireT){
  towerBase(c,x,y,s,rgb);

  if(kind==='password'){
    /* ПИЛОН — баяулату өрісін шығаратын кристалл тірегі */
    const ph=(tms/1400)%1;
    c.save(); c.globalAlpha=(1-ph)*0.5; c.strokeStyle=accent; c.lineWidth=1.6*s;
    c.beginPath(); c.arc(x,y,(6+ph*16)*s,0,6.28); c.stroke(); c.restore();
    // бүйір тіректер
    c.fillStyle='#1b2550';
    for(const sd of [-1,1]){ c.beginPath();
      c.moveTo(x+sd*11*s,y+6*s); c.lineTo(x+sd*7*s,y-6*s);
      c.lineTo(x+sd*4*s,y-6*s); c.lineTo(x+sd*6*s,y+6*s); c.closePath(); c.fill(); }
    // орталық баған
    c.fillStyle=shellGrad(c,x,y,11*s,accent);
    rrC(c,x-5.5*s,y-10*s,11*s,17*s,3.4*s); c.fill();
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=1*s;
    rrC(c,x-5.5*s,y-10*s,11*s,17*s,3.4*s); c.stroke();
    // кристалл (эмиссивті ромб + кілт тесігі)
    const bob=Math.sin(tms/600)*1.2*s;
    c.save(); c.translate(x,y-14*s+bob); c.rotate(tms/2200);
    c.shadowColor=accent; c.shadowBlur=12*s;
    c.fillStyle=accent; polyC(c,0,0,5.6*s,4,0); c.fill();
    c.restore();
    c.fillStyle='rgba(6,10,26,.85)';
    c.beginPath(); c.arc(x,y-15*s+bob,1.9*s,0,6.28); c.fill();
    c.fillRect(x-0.9*s,y-15*s+bob,1.8*s,3.2*s);

  } else if(kind==='antivirus'){
    /* ТУРЕЛЬ — нысанаға бұрылатын лазер оқпаны */
    c.save(); c.translate(x,y); c.rotate(aim);
    // оқпан
    c.fillStyle='#1b2550';
    rrC(c,2*s,-3.2*s,17*s,6.4*s,2.4*s); c.fill();
    c.strokeStyle='rgba(255,255,255,.22)'; c.lineWidth=1*s;
    rrC(c,2*s,-3.2*s,17*s,6.4*s,2.4*s); c.stroke();
    // суыту сақиналары
    c.fillStyle='rgba(0,0,0,.4)';
    for(let i=0;i<3;i++) c.fillRect(6*s+i*3.4*s,-3.2*s,1.3*s,6.4*s);
    // корпус
    c.fillStyle=shellGrad(c,0,0,13*s,accent);
    rrC(c,-11*s,-8.5*s,20*s,17*s,5*s); c.fill();
    c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=1.2*s;
    rrC(c,-11*s,-8.5*s,20*s,17*s,5*s); c.stroke();
    // желдеткіш саңылаулары
    c.fillStyle='rgba(0,0,0,.35)';
    for(let i=0;i<3;i++) rrC(c,-7*s,-5*s+i*3.4*s,7*s,1.8*s,0.9*s), c.fill();
    // линза (ату кезінде жанады)
    const hot=fireT>0?1:0.45;
    c.save(); c.shadowColor=accent; c.shadowBlur=(6+10*hot)*s;
    c.fillStyle=fireT>0?'#ffffff':accent;
    c.beginPath(); c.arc(18*s,0,3*s,0,6.28); c.fill(); c.restore();
    c.restore();

  } else if(kind==='firewall'){
    /* БАСТИОН — қорған қабырғасы: тіс-тіс парапет + оттық саңылаулар */
    // артқы қабырға
    c.fillStyle='#17203f';
    rrC(c,x-16*s,y-4*s,32*s,14*s,3*s); c.fill();
    // алдыңғы қаптама
    c.fillStyle=shellGrad(c,x,y,16*s,accent);
    rrC(c,x-15*s,y-2*s,30*s,11*s,3*s); c.fill();
    c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=1.1*s;
    rrC(c,x-15*s,y-2*s,30*s,11*s,3*s); c.stroke();
    // кірпіш жіктері
    c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=1*s;
    c.beginPath(); c.moveTo(x-15*s,y+3.5*s); c.lineTo(x+15*s,y+3.5*s); c.stroke();
    for(const bx of [-8,0,8]){ c.beginPath(); c.moveTo(x+bx*s,y+3.5*s); c.lineTo(x+bx*s,y+9*s); c.stroke(); }
    // тіс-тіс парапет (әр тістің өз блигі болуы үшін градиент жергілікті)
    for(const bx of [-12,-4,4,12]){
      c.fillStyle=shellGrad(c,x+bx*s,y-6.5*s,4.6*s,accent);
      rrC(c,x+(bx-3.2)*s,y-10*s,6.4*s,7*s,1.6*s); c.fill();
      c.strokeStyle='rgba(255,255,255,.3)'; c.lineWidth=.9*s;
      rrC(c,x+(bx-3.2)*s,y-10*s,6.4*s,7*s,1.6*s); c.stroke();
    }
    // тістер арасындағы ыстық саңылаулар
    const heat=0.55+0.45*Math.sin(tms/240);
    c.save(); c.shadowColor=accent; c.shadowBlur=7*s*heat; c.fillStyle=accent; c.globalAlpha=heat;
    for(const gx of [-8,0,8]) c.fillRect(x+(gx-1.2)*s,y-8*s,2.4*s,5*s);
    c.restore();
    // оттық — нысанаға бұрылады
    c.save(); c.translate(x,y-3*s); c.rotate(aim);
    c.fillStyle='#1b2550'; rrC(c,4*s,-2.4*s,11*s,4.8*s,2*s); c.fill();
    c.save(); c.shadowColor=accent; c.shadowBlur=(fireT>0?12:5)*s;
    c.fillStyle=fireT>0?'#fff1e0':accent;
    c.beginPath(); c.arc(14*s,0,2.4*s,0,6.28); c.fill(); c.restore();
    c.restore();

  } else {
    /* ТАРЕЛКА — серверді «емдейтін» сигнал антеннасы */
    // тірек
    c.fillStyle='#1b2550';
    c.beginPath(); c.moveTo(x-4.5*s,y+9*s); c.lineTo(x+4.5*s,y+9*s);
    c.lineTo(x+2.2*s,y-2*s); c.lineTo(x-2.2*s,y-2*s); c.closePath(); c.fill();
    // импульс доғалары
    const ph=(tms/900)%1;
    c.save(); c.globalAlpha=(1-ph)*0.55; c.strokeStyle=accent; c.lineWidth=1.6*s;
    for(let k=0;k<2;k++){ const rr=(5+ph*13+k*5)*s;
      c.beginPath(); c.arc(x,y-9*s,rr,-2.5,-0.65); c.stroke(); }
    c.restore();
    // табақ
    c.save(); c.translate(x,y-9*s); c.rotate(-0.5);
    c.fillStyle=shellGrad(c,0,0,13*s,accent);
    c.beginPath(); c.ellipse(0,0,12.5*s,12.5*s,0,Math.PI*0.08,Math.PI*0.92); c.fill();
    c.strokeStyle='rgba(255,255,255,.45)'; c.lineWidth=1.3*s;
    c.beginPath(); c.ellipse(0,0,12.5*s,12.5*s,0,Math.PI*0.08,Math.PI*0.92); c.stroke();
    // ішкі көлеңке
    c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=1*s;
    c.beginPath(); c.ellipse(0,0,8*s,8*s,0,Math.PI*0.1,Math.PI*0.9); c.stroke();
    // сәуле шығарғыш
    c.fillStyle='#1b2550'; c.fillRect(-1*s,-8*s,2*s,7*s);
    c.save(); c.shadowColor=accent; c.shadowBlur=9*s;
    c.fillStyle=accent; c.beginPath(); c.arc(0,-8.5*s,2.6*s,0,6.28); c.fill(); c.restore();
    c.restore();
  }

  // жұмыс индикаторы — іргетастағы шағын LED
  c.save(); c.shadowColor=accent; c.shadowBlur=5*s; c.fillStyle=accent;
  c.beginPath(); c.arc(x+12.5*s,y+12.5*s,1.9*s,0,6.28); c.fill(); c.restore();
}

/* Дүкендегі иконка — тақтадағы мұнараның дәл өзі (бір дереккөз) */
function towerThumb(kind){
  const PX=34, dpr=3, cv2=document.createElement('canvas');
  cv2.width=PX*dpr; cv2.height=PX*dpr;
  const c2=cv2.getContext('2d'); c2.scale(dpr,dpr);
  const t=TOWERS[kind];
  drawTowerArt(c2,kind,PX/2,PX/2+4,0.72,0,-Math.PI/2,t.color,t.cr,0);
  return cv2.toDataURL();
}

/* ══ ЖАУ СУРЕТТЕРІ — әрқайсысының өз силуэті ══ */
function drawEnemyArt(c,e,tms){
  const et=ETYPE[e.type], col=et.col;
  c.save(); c.translate(e.x,e.y);
  // қозғалыс ізі
  c.save(); c.rotate(e.ang||0); c.strokeStyle=col; c.lineCap='round';
  for(let i=0;i<3;i++){ c.globalAlpha=.3-i*0.09; c.lineWidth=(2.2-i*0.5);
    c.beginPath(); c.moveTo(-e.r-4-i*7,0); c.lineTo(-e.r-9-i*7,0); c.stroke(); }
  c.restore();

  if(e.type==='phish'){
    // ДЕРЕК ПАКЕТІ — жалған хат + ілмек
    c.save(); c.shadowColor=col; c.shadowBlur=8;
    c.fillStyle='#1a1405'; rrC(c,-11,-8,22,16,3); c.fill();
    c.strokeStyle=col; c.lineWidth=1.6; rrC(c,-11,-8,22,16,3); c.stroke(); c.restore();
    c.strokeStyle=col; c.lineWidth=1.4; c.globalAlpha=.85;
    c.beginPath(); c.moveTo(-9,-6); c.lineTo(0,1); c.lineTo(9,-6); c.stroke();
    c.globalAlpha=1;
    // ілмек
    c.strokeStyle='#fff'; c.lineWidth=1.5; c.lineCap='round';
    c.beginPath(); c.moveTo(0,-8); c.lineTo(0,-13);
    c.arc(2.4,-13,2.4,Math.PI,Math.PI*2.15); c.stroke();

  } else if(e.type==='trojan'){
    // ВИРУС — айналатын тікенекті қабық
    const rot=tms/900+e.seed;
    c.save(); c.rotate(rot);
    c.strokeStyle=col; c.lineWidth=2.2; c.lineCap='round';
    for(let i=0;i<8;i++){ const a=i*Math.PI/4;
      c.beginPath(); c.moveTo(Math.cos(a)*8,Math.sin(a)*8); c.lineTo(Math.cos(a)*13,Math.sin(a)*13); c.stroke();
      c.fillStyle=col; c.beginPath(); c.arc(Math.cos(a)*13.6,Math.sin(a)*13.6,1.7,0,6.28); c.fill(); }
    c.restore();
    c.save(); c.shadowColor=col; c.shadowBlur=10;
    c.fillStyle=shellGrad(c,0,0,9,col);
    c.beginPath(); c.arc(0,0,8.4,0,6.28); c.fill(); c.restore();
    // өзек-көз
    c.fillStyle='#13031f'; c.beginPath(); c.arc(0,0,4.2,0,6.28); c.fill();
    c.fillStyle=col; c.beginPath(); c.arc(Math.cos(tms/500)*1.1,Math.sin(tms/500)*1.1,1.9,0,6.28); c.fill();

  } else {
    // БОСС — сауытты шифрлаушы: айналатын сегмент сақинасы + құлып
    const pulse=0.6+0.4*Math.sin(tms/300);
    c.save(); c.rotate(tms/1600);
    c.strokeStyle=col; c.lineWidth=3; c.globalAlpha=.8;
    for(let i=0;i<6;i++){ const a=i*Math.PI/3;
      c.beginPath(); c.arc(0,0,21,a,a+0.55); c.stroke(); }
    c.restore();
    c.save(); c.shadowColor=col; c.shadowBlur=16*pulse;
    c.fillStyle=shellGrad(c,0,0,17,col);
    polyC(c,0,0,16,6,Math.PI/6); c.fill();
    c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=1.6;
    polyC(c,0,0,16,6,Math.PI/6); c.stroke(); c.restore();
    polyC(c,0,0,11,6,Math.PI/6);
    c.fillStyle='rgba(12,2,6,.8)'; c.fill();
    // құлып эмблемасы
    c.strokeStyle='#fff'; c.lineWidth=2; c.lineCap='round';
    c.beginPath(); c.arc(0,-2.5,3.6,Math.PI,0); c.stroke();
    c.fillStyle='#fff'; rrC(c,-5,-2,10,8,1.8); c.fill();
    c.fillStyle='#2a0409'; c.beginPath(); c.arc(0,2,1.3,0,6.28); c.fill();
  }
  c.restore();
}

/* ── draw ── */
function draw(){
  const T=performance.now();
  ctx.clearRect(0,0,W,H);
  // тор
  ctx.strokeStyle='rgba(80,140,255,.07)'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // ДЕРЕК АРНАЛАРЫ — батырылған науа + ағып жатқан сигнал
  for(const p of PATHS){
    const trace=()=>{ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);};
    ctx.lineCap='round';ctx.lineJoin='round';
    trace(); ctx.strokeStyle='rgba(2,7,22,.75)'; ctx.lineWidth=36; ctx.stroke();
    trace(); ctx.strokeStyle='rgba(0,180,255,.09)'; ctx.lineWidth=30; ctx.stroke();
    trace(); ctx.strokeStyle='rgba(120,190,255,.14)'; ctx.lineWidth=1.4; ctx.stroke();
    ctx.save(); ctx.shadowColor='rgba(0,210,255,.8)'; ctx.shadowBlur=6;
    trace(); ctx.strokeStyle='rgba(0,220,255,.55)'; ctx.lineWidth=2.6;
    ctx.setLineDash([4,14]); ctx.lineDashOffset=-(T/28%18); ctx.stroke(); ctx.setLineDash([]); ctx.restore();

    // ПОРТАЛ — кіреберіс сақинасы
    const px=p[0].x<0?8:p[0].x>W?W-8:p[0].x, py=p[0].y<0?8:p[0].y>H?H-8:p[0].y;
    const pg=ctx.createRadialGradient(px,py,1,px,py,16);
    pg.addColorStop(0,'rgba(160,120,255,.55)'); pg.addColorStop(1,'rgba(120,80,255,0)');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,16,0,6.28); ctx.fill();
    ctx.save(); ctx.translate(px,py); ctx.rotate(T/1200);
    ctx.strokeStyle='rgba(170,130,255,.85)'; ctx.lineWidth=2.4;
    for(let i=0;i<3;i++){const a=i*Math.PI*2/3; ctx.beginPath(); ctx.arc(0,0,10,a,a+1.1); ctx.stroke();}
    ctx.restore();
    ctx.fillStyle='#c4a6ff'; ctx.beginPath(); ctx.arc(px,py,4.2,0,6.28); ctx.fill();
  }

  // БАС СЕРВЕР
  ctx.textAlign='center';ctx.textBaseline='middle';
  drawServerCore();

  // МҰНАРАЛАР
  for(const t of towers){
    if(armed===null){
      ctx.save(); ctx.strokeStyle=`rgba(${t.cr},.13)`; ctx.lineWidth=1.2; ctx.setLineDash([3,7]);
      ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,6.28); ctx.stroke(); ctx.restore();
    }
    drawTowerArt(ctx,t.type,t.x,t.y,1,T,t.aim||-Math.PI/2,t.color,t.cr,t.fireT||0);
  }

  // АТЫСТАР — жарық өзегі бар сәуле + соққы жарқылы
  for(const s of shots){
    const a=Math.min(1,s.life*12);
    ctx.save(); ctx.globalAlpha=a*.45; ctx.strokeStyle=s.col; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    ctx.globalAlpha=a; ctx.strokeStyle='#fff'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    const fg=ctx.createRadialGradient(s.x2,s.y2,0,s.x2,s.y2,9);
    fg.addColorStop(0,'rgba(255,255,255,.9)'); fg.addColorStop(1,`rgba(${'255,255,255'},0)`);
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(s.x2,s.y2,9,0,6.28); ctx.fill();
    ctx.restore();
  }

  // ЖАУЛАР
  for(const e of enemies){
    drawEnemyArt(ctx,e,T);
    // HP — дөңгелектелген капсула
    const bw=Math.max(22,e.r*2.2), bh=4, by=e.y-e.r-11;
    ctx.fillStyle='rgba(0,0,0,.6)'; rrC(ctx,e.x-bw/2,by,bw,bh,bh/2); ctx.fill();
    const fr=Math.max(0,e.hp/e.maxhp);
    ctx.fillStyle=fr>.5?'#46e06a':fr>.25?'#f59e0b':'#ef4444';
    if(fr>0){ rrC(ctx,e.x-bw/2,by,Math.max(bh,bw*fr),bh,bh/2); ctx.fill(); }
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=.8; rrC(ctx,e.x-bw/2,by,bw,bh,bh/2); ctx.stroke();
    // баяулау белгісі
    if(e.slow<1){
      ctx.save(); ctx.translate(e.x+e.r+5,e.y-e.r-2); ctx.strokeStyle='#9dc4ff'; ctx.lineWidth=1.3; ctx.lineCap='round';
      for(let i=0;i<3;i++){const a=i*Math.PI/3;
        ctx.beginPath(); ctx.moveTo(-Math.cos(a)*3.4,-Math.sin(a)*3.4); ctx.lineTo(Math.cos(a)*3.4,Math.sin(a)*3.4); ctx.stroke();}
      ctx.restore();
    }
  }

  // бөлшектер
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.28);ctx.fill();ctx.globalAlpha=1; }

  // ОРНАЛАСТЫРУ КӨЛЕҢКЕСІ
  if(ghost&&armed){
    const ok=buildable(ghost.x,ghost.y)&&energy>=TOWERS[armed].cost, t=TOWERS[armed];
    ctx.save();
    ctx.strokeStyle=ok?'rgba(70,224,106,.75)':'rgba(239,68,68,.75)'; ctx.lineWidth=1.6; ctx.setLineDash([5,6]);
    ctx.beginPath(); ctx.arc(ghost.x,ghost.y,t.range,0,6.28); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=ok?'rgba(70,224,106,.10)':'rgba(239,68,68,.10)';
    ctx.beginPath(); ctx.arc(ghost.x,ghost.y,t.range,0,6.28); ctx.fill();
    ctx.globalAlpha=.75;
    drawTowerArt(ctx,armed,ghost.x,ghost.y,1,T,-Math.PI/2,t.color,t.cr,0);
    if(!ok){ ctx.globalAlpha=.5; ctx.strokeStyle='#ef4444'; ctx.lineWidth=2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(ghost.x-11,ghost.y-11); ctx.lineTo(ghost.x+11,ghost.y+11);
      ctx.moveTo(ghost.x+11,ghost.y-11); ctx.lineTo(ghost.x-11,ghost.y+11); ctx.stroke(); }
    ctx.restore();
  }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function polygonPath(cx,cy,r,sides,rot){
  ctx.beginPath();
  for(let i=0;i<=sides;i++){
    const a=rot+(i/sides)*Math.PI*2;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
/* «Бас сервер» — жай квадрат-иконка емес, реактор тәрізді анимацияланған өзек:
   соғатын жарық ореолы, айналатын энергия сақинасы, сегіз қырлы платформа,
   HP прогресс-сақинасы және өзекті айналып жүрген энергия нүктелері. */
function drawServerCore(){
  const t=performance.now();
  const sp=SERVER.hp/SERVER.maxhp;
  const col = sp>.5?'#46e06a':sp>.2?'#f59e0b':'#ef4444';
  const rgb = sp>.5?'70,224,106':sp>.2?'245,158,11':'239,68,68';
  const cx=SERVER.x, cy=SERVER.y;

  // соғатын жарық ореолы
  const pulse=.55+Math.sin(t/450)*.18, glowR=46+Math.sin(t/450)*3;
  const grad=ctx.createRadialGradient(cx,cy,6,cx,cy,glowR);
  grad.addColorStop(0,`rgba(${rgb},${(.4*pulse).toFixed(2)})`); grad.addColorStop(1,`rgba(${rgb},0)`);
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,glowR,0,6.28); ctx.fill();

  // айналатын энергия сақинасы (тактар)
  const rot=t/6000;
  ctx.strokeStyle=`rgba(${rgb},.4)`; ctx.lineWidth=2; ctx.lineCap='round';
  for(let i=0;i<16;i++){
    const a=rot+(i/16)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*44, cy+Math.sin(a)*44);
    ctx.lineTo(cx+Math.cos(a)*49, cy+Math.sin(a)*49);
    ctx.stroke();
  }

  // HP прогресс-сақинасы (фон трек + белсенді доға)
  ctx.beginPath(); ctx.arc(cx,cy,38,0,6.28); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=4; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,38,-1.5708,-1.5708+6.2832*sp);
  ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.shadowColor=col; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;

  // сегіз қырлы негізгі платформа (көлемді)
  ctx.save();
  ctx.shadowColor=`rgba(${rgb},.8)`; ctx.shadowBlur=20;
  const plate=ctx.createLinearGradient(cx,cy-30,cx,cy+30);
  plate.addColorStop(0,'#16264f'); plate.addColorStop(1,'#0a1330');
  ctx.fillStyle=plate; ctx.strokeStyle=col; ctx.lineWidth=2.5;
  polygonPath(cx,cy,29,8,Math.PI/8); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle=`rgba(${rgb},.35)`; ctx.lineWidth=1;
  polygonPath(cx,cy,22,8,Math.PI/8); ctx.stroke();

  // ӨЗЕК — қабатталған алты қырлы блок (жалпақ иконка емес)
  ctx.save();
  ctx.fillStyle='#0a1330';
  polygonPath(cx,cy,15,6,Math.PI/6); ctx.fill();
  const coreG=ctx.createLinearGradient(cx-13,cy-13,cx+13,cy+13);
  coreG.addColorStop(0,'#ffffff'); coreG.addColorStop(.2,col); coreG.addColorStop(1,'#0b1a35');
  ctx.strokeStyle=coreG; ctx.lineWidth=2.2;
  polygonPath(cx,cy,15,6,Math.PI/6); ctx.stroke();
  // деректер қабаттары — эмиссивті тілікшелер
  const beat=0.55+0.45*Math.sin(t/380);
  ctx.shadowColor=col; ctx.shadowBlur=8*beat;
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i===1?1:0.55+0.3*beat;
    ctx.fillStyle=col;
    const w=i===1?15:11;
    ctx.fillRect(cx-w/2, cy-6+i*5, w, 2.6);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  // бүйір қысқыштар
  ctx.fillStyle=`rgba(${rgb},.7)`;
  ctx.fillRect(cx-17,cy-3,3,6); ctx.fillRect(cx+14,cy-3,3,6);
  ctx.restore();

  // өзекті айналған энергия нүктелері (база тірі болса)
  if(sp>0){
    for(let i=0;i<3;i++){
      const a=t/1100+i*(Math.PI*2/3);
      const ox=cx+Math.cos(a)*50, oy=cy+Math.sin(a)*50*0.55;
      ctx.globalAlpha=.8; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(ox,oy,2.6,0,6.28); ctx.fill();
      ctx.globalAlpha=1;
    }
  }
}
function bink(x,y,c){ for(let k=0;k<10;k++){const a=Math.random()*6.28,s=30+Math.random()*40;particles.push({x,y,vx:Math.cos(a)*s/60,vy:Math.sin(a)*s/60,life:.5,col:c});} }

/* ── end / audit ── */
function endGame(){
  if(gameOver) return; gameOver=true; phase='over';
  const def=Math.max(0,Math.round(SERVER.hp));
  let medal,title,sub,crys,audit;
  const hasBackup=towers.some(t=>t.type==='backup');
  const hasFirewall=towers.some(t=>t.type==='firewall');
  if(def>=90){ medal='🎖️'; title='Кибер-Генерал'; sub='CYBER GENERAL'; crys=3;
    audit=`<b>Қорғау деңгейі: ${def}% — мықты заманауи база!</b><br>База толық аман, вирустар өтпеді. Брандмауэр мен Антивирусты дұрыс орналастырдың. 💡 Кеңес: интернетте маңызды файлдардың бұлтты көшірмесін алдын ала жасап жүр!`; }
  else if(def>=50){ medal='🛡️'; title='Қорғаушы'; sub='SECURITY AGENT'; crys=2;
    audit=`<b>Қорғау деңгейі: ${def}% — сервер аздап зақымдалды.</b><br>${hasBackup?'Backup қойма деректерді құтқарып қалды. ☁️':'Backup мұнарасын ертерек қойсаң, серверді толық сақтап қалар едің. ☁️'} ${hasFirewall?'':'Брандмауэрді порталға қойсаң, фишингті 100% тойтарар едің. 🔥'}`; }
  else { medal='🧩'; title='Қайта жүктеу керек'; sub='SYSTEM REBOOT'; crys=0;
    audit=`<b>Қорғау деңгейі: ${def}% — база бұзылды.</b><br>Ештеңе етпейді! Мұнараларды басқаша орналастыр: Брандмауэр — порталға, Антивирус — жолға жақын, Backup — Боссқа қарсы. Қайта байқап көр!`; }

  kron(def>=50?'good':'alert', `📊 КИБЕР-АУДИТ: Қорғау деңгейі ${def}%. ${title} мәртебесі!`);

  document.getElementById('rMedal').textContent=medal;
  document.getElementById('rTitle').textContent=title;
  document.getElementById('rSub').textContent=sub;
  document.getElementById('rDefPct').textContent='🛡️ Қорғау: '+def+'%';
  document.getElementById('rAudit').innerHTML='<b>🤖 ЖИ Кронос аудиті:</b><br>'+audit;
  document.getElementById('rCrys').textContent='💎 +'+crys+' Деректер кристалы';
  const btns=document.getElementById('rBtns'); btns.innerHTML='';
  if(crys<3){ const r=document.createElement('button'); r.className='r-btn retry'; r.textContent='↻ Қайта'; r.onclick=()=>location.reload(); btns.appendChild(r); }
  const g=document.createElement('button'); g.className='r-btn go'; g.textContent='Картаға оралу'; g.onclick=()=>finishGame(crys); btns.appendChild(g);
  setTimeout(()=>{ document.getElementById('rDefFill').style.width=def+'%'; },100);
  document.getElementById('result').classList.add('show');
  if(crys>0) confetti();
  window._finalCrys=crys;
}

let submitting=false;
function finishGame(crys){
  if(submitting) return; submitting=true;
  try{
    const k='bilimquest_t4_progress_v1';
    let s=JSON.parse(localStorage.getItem(k));
    if(!s||!s.status||s.status.length!==5) s={status:['active','locked','locked','locked','locked']};
    if(crys>0){ s.status[3]='done'; if(s.status[4]==='locked') s.status[4]='active'; }
    localStorage.setItem(k,JSON.stringify(s));
  }catch(e){}
  const score=Math.round(crys/3*0.3*100)/100;
  if(crys>0){ bqFinish({game_name:'Кибер-бекініс', score, stars:crys>=3?1:0, backUrl:'/toqsan_4'}); }
  else location.href='/toqsan_4';
}

const krLog=document.getElementById('krLog');
function kron(cls,txt){
  const m=document.createElement('div'); m.className='kmsg'+(cls?' '+cls:'');
  m.innerHTML=`<div class="av">${iconSVG('kronos','#8fb3ff',17)}</div><div class="bub">${txt}</div>`;
  krLog.appendChild(m); krLog.scrollTop=krLog.scrollHeight;
  while(krLog.children.length>14) krLog.removeChild(krLog.firstChild);
}

/* ── audio ── */
let actx;
function beep(f,dur){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,actx.currentTime);
  g.gain.linearRampToValueAtTime(0,actx.currentTime+(dur||.12));o.start();o.stop(actx.currentTime+(dur||.12));}catch(e){}}
function confetti(){const cs=['#7dffa0','#46e06a','#37e1ff','#ffd24a','#6d5dfc','#fff'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';const sz=6+Math.random()*7,d=2.2+Math.random()*1.8;
  c.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*1.6}px;background:${cs[i%cs.length]};border-radius:2px;animation-duration:${d}s;animation-delay:${Math.random()*.5}s`;
  document.body.appendChild(c);setTimeout(()=>c.remove(),(d+.7)*1000);}}
